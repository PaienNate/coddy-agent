# Chinese descriptions of internal/config/config.schema.json, keyed like the
# rows of the configuration reference (docs/zh/reference/config.md). `en` is
# the English description the entry translates.
browser:
  en: 'Coddy for Browser: the extension connects to the HTTP server, lets chats work in the user''s browser through the browser tool and shows the web UI in its side panel; chats of other Coddy processes and of the swarm reach the browser through this server. Needs a binary built with the browser tag; off by default. See https://coddy.dev/docs/features/browser.'
  zh: Coddy for Browser：扩展连接到 HTTP 服务器，让聊天通过 browser 工具在用户的浏览器中工作，并在其侧边面板中显示 Web 界面；其他 Coddy 进程和集群的聊天通过此服务器访问浏览器。需要带有 browser 构建标签的二进制文件；默认关闭。参见 https://coddy.dev/docs/features/browser。
browser.enable:
  en: Offer the browser tool to the chats of this process. Needs browser.token, browser.remotes or both.
  zh: 向此进程的聊天提供 browser 工具。需要 browser.token、browser.remotes 或两者。
browser.token:
  en: The extension key, at least 32 characters, independent of the HTTP API's credentials. With it the HTTP server accepts the extension (/browser/v1/connect), and it also signs the extension's side panel into the web UI, so keep it as secret as the API's token. Write-only. Use an environment reference to keep it out of YAML.
  zh: 扩展密钥，至少 32 个字符，独立于 HTTP API 的凭据。凭借它，HTTP 服务器接受扩展（/browser/v1/connect），并且它还用于将扩展的侧边面板登录到 Web 界面，因此要像 API 的令牌一样保密。只写字段。使用环境引用以避免将其写入 YAML。
browser.serve_remote:
  en: 'Let other Coddy processes drive the browsers connected here: a console or an editor on this machine, a node of the swarm. They call /coddy/browser/v1 with this server''s API credential, and the extension asks the person before the first action of each such chat. Needs browser.token.'
  zh: 允许其他 Coddy 进程驱动此处连接的浏览器：本机上的控制台或编辑器、集群中的一个节点。它们使用此服务器的 API 凭据调用 /coddy/browser/v1，并且扩展会在每个此类聊天的第一个操作之前询问用户。需要 browser.token。
browser.remotes:
  en: 'Coddy servers whose browsers the chats of this process may use, besides its own: a name of httpserver.remotes, or a server address such as a node mount of a swarm relay (https://relay:8443/swarm/nodes/home), whose token is found like --remote''s. That server needs browser.serve_remote.'
  zh: 此进程的聊天除自身之外还可以使用其浏览器的 Coddy 服务器：httpserver.remotes 中的名称，或服务器地址，例如集群中继的节点挂载（https://relay:8443/swarm/nodes/home），其令牌的查找方式与 --remote 相同。该服务器需要 browser.serve_remote。
providers:
  en: API credentials and transport selection for upstream LLM vendors. When api_key is empty, the runtime reads the NAME_API_KEY environment variable (NAME is the provider name in uppercase with hyphens mapped to underscores); a row of type "codex" signs in with ChatGPT and reads no key, and a Kimi subscription reads no API key.
  zh: 上游 LLM 供应商的 API 凭据和传输选择。当 api_key 为空时，运行时读取 NAME_API_KEY 环境变量（NAME 是提供商名称的大写形式，连字符映射为下划线）；type 为 "codex" 的行使用 ChatGPT 登录并且不读取密钥，Kimi 订阅也不读取 API 密钥。
providers[].name:
  en: Logical id used as the first segment of models[].model. ASCII letters, digits, hyphen, underscore; must start with a letter.
  zh: 用作 models[].model 第一段的逻辑 id。ASCII 字母、数字、连字符、下划线；必须以字母开头。
providers[].type:
  en: "Wire protocol for this provider entry. Use deepseek for the official DeepSeek API, with its thinking controls, prompt-cache accounting and V4 Flash/Pro presets; openai for any other OpenAI-compatible endpoint."
  zh: "此提供商条目的通信协议。官方 DeepSeek API 使用 deepseek，以获得思考控制、提示词缓存统计和 V4 Flash/Pro 预设；其他 OpenAI 兼容端点使用 openai。"
providers[].mode:
  en: Kimi credential mode. Omitted means subscription.
  zh: Kimi 凭据模式。省略表示订阅。
providers[].region:
  en: Kimi region. Omitted means global.
  zh: Kimi 区域。省略表示全球。
providers[].kimi_identity:
  en: Stable random identity of this Kimi provider row, used to isolate managed credentials.
  zh: 此 Kimi 提供商行的稳定随机标识，用于隔离受管凭据。
providers[].api_base:
  en: 'Optional base URL override. For type "openai" include /v1 (e.g. http://localhost:11434/v1); for type "anthropic" an Anthropic-compatible gateway (default https://api.anthropic.com). For type "neuraldeep" it selects the deployment: https://api.neuraldeep.ru/v1 (Russia, the default) or https://api.neuraldeep.tech/v1 (the international mirror); any other value falls back to the default. For type "opencode" it selects the gateway: https://opencode.ai/inference/go/v1 (the Go subscription, the default) or https://opencode.ai/inference/v1 (pay-as-you-go Console); any other value falls back to the default. For type "kimi", subscription rejects api_base; Platform requests use the endpoint selected by region rather than api_base. Ignored for types "codex" and "devin", which always use their official endpoints, and for type "acp", whose agent runs on this machine.'
  zh: 可选的基 URL 覆盖。对于 type "openai"，包含 /v1（例如 http://localhost:11434/v1）；对于 type "anthropic"，为兼容 Anthropic 的网关（默认 https://api.anthropic.com）。对于 type "neuraldeep"，它选择部署：https://api.neuraldeep.ru/v1（俄罗斯，默认）或 https://api.neuraldeep.tech/v1（国际镜像）；任何其他值都回退到默认值。对于 type "opencode"，它选择网关：https://opencode.ai/inference/go/v1（Go 订阅，默认）或 https://opencode.ai/inference/v1（按量付费 Console）；任何其他值都回退到默认值。对于 type "kimi"，订阅拒绝 api_base；Platform 请求使用由 region 选择的端点，而不是 api_base。对于 type "codex" 和 "devin" 会被忽略，它们始终使用其官方端点；对于 type "acp" 也会被忽略，其智能体在此机器上运行。
providers[].api_key:
  en: 'Provider secret. A literal key, a "${ENV}" reference expanded at load time, or empty to read NAME_API_KEY at LLM call time. Resolution order: api_key -> api_key_command stdout -> NAME_API_KEY. For type "devin" it is a Devin session token and, when set, wins over the browser login and the Devin CLI login. For type "opencode" an explicit key wins over the login `coddy providers login opencode` stored. For type "kimi", Platform uses a Platform API key; subscription rejects api_key and does not use NAME_API_KEY. Ignored for type "codex", which signs in with ChatGPT, and for type "acp", whose agent signs in on its own.'
  zh: 提供商密钥。字面密钥、在加载时展开的 "${ENV}" 引用，或为空以在 LLM 调用时读取 NAME_API_KEY。解析顺序：api_key -> api_key_command 的 stdout -> NAME_API_KEY。对于 type "devin"，它是 Devin 会话令牌，设置后优先于浏览器登录和 Devin CLI 登录。对于 type "opencode"，显式密钥优先于 `coddy providers login opencode` 存储的登录。对于 type "kimi"，Platform 使用 Platform API 密钥；订阅拒绝 api_key 并且不使用 NAME_API_KEY。对于 type "codex" 会被忽略，它使用 ChatGPT 登录；对于 type "acp" 也会被忽略，其智能体自行登录。
providers[].api_key_command:
  en: Optional credential-helper command. When api_key is empty it runs via the detected host shell (pwsh, powershell, or cmd on Windows; bash or sh elsewhere) and the trimmed stdout is used as the key. On failure resolution falls back to NAME_API_KEY. For type "kimi", Platform can use this command; subscription rejects it. Never run for types "codex" and "acp", which take no key.
  zh: 可选的凭据辅助命令。当 api_key 为空时，它通过检测到的主机 shell（Windows 上为 pwsh、powershell 或 cmd；其他平台为 bash 或 sh）运行，并将去除首尾空白后的 stdout 用作密钥。失败时，解析会回退到 NAME_API_KEY。对于 type "kimi"，Platform 可以使用此命令；订阅拒绝它。对于 type "codex" 和 "acp" 绝不会运行，因为它们不接收密钥。
providers[].proxy:
  en: 'inherit (the default, the same as leaving the key out), none, or a proxy URL: http://, https://, socks5:// or socks5h://. inherit follows the proxy the environment of the Coddy process names - HTTPS_PROXY, HTTP_PROXY and NO_PROXY, never for a loopback address; ALL_PROXY is not read. none connects directly and ignores those variables. A proxy URL sends every request of this row through that proxy, NO_PROXY and loopback included; with SOCKS the proxy resolves host names. The setting covers every request of the provider: its completions, its model list, its account usage and its sign-in. For type "acp" the agent makes its own requests: inherit leaves the proxy variables of Coddy''s environment as they are, ALL_PROXY included, a proxy URL is passed to it as HTTPS_PROXY and HTTP_PROXY, with NO_PROXY set to the loopback addresses and ALL_PROXY removed, none removes the proxy variables from its environment, and whether the agent honours them is up to the agent.'
  zh: inherit（默认值，与省略该键相同）、none，或代理 URL：http://,、https://,、socks5:// 或 socks5h://。inherit 遵循 Coddy 进程环境指定的代理，即 HTTPS_PROXY、HTTP_PROXY 和 NO_PROXY，从不用于回环地址；不会读取 ALL_PROXY。none 直接连接并忽略这些变量。代理 URL 会让此行的每个请求都通过该代理，包括 NO_PROXY 和回环地址；使用 SOCKS 时，由代理解析主机名。该设置覆盖提供商的每个请求：其补全、模型列表、账户用量和登录。对于 type "acp"，智能体自行发出请求：inherit 会保持 Coddy 环境的代理变量不变，包括 ALL_PROXY；代理 URL 会作为 HTTPS_PROXY 和 HTTP_PROXY 传递给它，并将 NO_PROXY 设为回环地址且移除 ALL_PROXY；none 会从其环境中移除代理变量，而智能体是否遵循它们取决于智能体。
providers[].timeout_ms:
  en: Optional bound on each LLM HTTP request to this provider, including the streamed body read; for type "acp", on each prompt the agent answers. 0 (the default) sets no client timeout, so slow prompt processing on large contexts is never cut short.
  zh: 对发往此提供商的每个 LLM HTTP 请求的可选限制，包括流式响应体读取；对于 type "acp"，则限制智能体回答的每个提示词。0（默认值）不设置客户端超时，因此在大型上下文上缓慢的提示词处理绝不会被提前截断。
providers[].usage_limits_panel:
  en: Show this provider's account usage panel (the console footer line and /usage, the usage section and banner in the web UI) and read the provider's usage endpoint for it (GET /v1/limits for type neuraldeep, the Codex backend's usage endpoint for type codex, the seat-management status RPC for type devin). For type kimi, subscription usage reads /usages and Platform has no usage source. Omit or true keeps the panel on; false hides it and stops those reads for this row. Only providers whose type has a usage source are affected.
  zh: 显示此提供商的账户用量面板（控制台页脚行和 /usage、Web 界面中的用量章节和横幅），并为此读取提供商的用量端点（type 为 neuraldeep 时为 GET /v1/limits，type 为 codex 时为 Codex 后端的用量端点，type 为 devin 时为席位管理状态 RPC）。对于 type kimi，订阅用量读取 /usages，而 Platform 没有用量来源。省略或 true 会保持面板开启；false 会隐藏它并停止此行的这些读取。只有 type 具有用量来源的提供商才会受到影响。
providers[].acp:
  en: 'The agent a provider of type "acp" runs: a local program that speaks the Agent Client Protocol on stdio, started on the first call and kept for every session of the row (one per session with process: per_session, one per workspace when a value names ${CWD}), stopped after idle_timeout_ms without a call. Read only on a row of type acp; see https://coddy.dev/docs/features/acp-provider.'
  zh: 'type 为 "acp" 的提供商所运行的智能体：一个在 stdio 上使用 Agent Client Protocol 的本地程序，在第一次调用时启动，并为此行的每个会话保留（当 process: per_session 时每个会话一个，当某个值命名 ${CWD} 时每个工作区一个），在无调用达到 idle_timeout_ms 后停止。仅在 type 为 acp 的行上读取；参见 https://coddy.dev/docs/features/acp-provider.'
providers[].acp.command:
  en: The agent program (looked up on PATH), for example claude-agent-acp, codex-acp, opencode or coddy. Required for type acp.
  zh: 智能体程序（在 PATH 中查找），例如 claude-agent-acp、codex-acp、opencode 或 coddy。type acp 必填。
providers[].acp.args:
  en: Arguments after the command, for example [acp] for opencode and coddy.
  zh: 命令之后的参数，例如 opencode 和 coddy 的 [acp]。
providers[].acp.env:
  en: Variables added to the environment Coddy passes the agent, for example a key the agent reads. ${CWD} in a value, in an argument, in the command or in cwd is the session's workspace, and the agent is then started once per workspace.
  zh: 添加到 Coddy 传递给智能体的环境中的变量，例如智能体读取的密钥。值、参数、命令或 cwd 中的 ${CWD} 是会话的工作区，此时智能体会按每个工作区启动一次。
providers[].acp.cwd:
  en: A fixed folder for the agent process and for every ACP session. Empty (the default) opens each session in the workspace of the Coddy session it serves.
  zh: 智能体进程和每个 ACP 会话的固定文件夹。为空（默认值）时，会在其服务的 Coddy 会话的工作区中打开每个会话。
providers[].acp.auth_method:
  en: 'The id of the authentication method Coddy passes to the ACP authenticate call after initialize, for an agent that refuses a session until a client authenticates it (codex-acp: api-key, with OPENAI_API_KEY in env). Empty calls none: the agent uses the sign-in it has on its own.'
  zh: Coddy 在 initialize 之后传给 ACP authenticate 调用的身份验证方法 id，用于在客户端完成身份验证之前拒绝会话的智能体（codex-acp：api-key，并在 env 中带有 OPENAI_API_KEY）。为空则不调用任何方法：智能体使用其自身已有的登录。
providers[].acp.permissions:
  en: 'What Coddy answers when the agent asks permission to run one of its tools: ask forwards the request to the person through the session''s permission prompt (allowed without asking in a session whose permission mode is bypass, and an edit under accept_edits), allow approves it once, deny refuses it. In the plan and ask modes every request is refused.'
  zh: 当智能体请求运行其某个工具的权限时 Coddy 的答复：ask 通过会话的权限提示将请求转发给用户（在权限模式为 bypass 的会话中，以及 accept_edits 下的编辑，会不经询问直接允许），allow 批准一次，deny 拒绝。在 plan 和 ask 模式下，每个请求都会被拒绝。
providers[].acp.modes:
  en: The agent's own mode (an ACP mode id, such as plan or read-only) for each Coddy session mode. An empty modes.agent keeps the agent's default mode. modes.plan and modes.ask must name a read-only mode of the agent; without it a turn in that mode is refused.
  zh: 针对每个 Coddy 会话模式，智能体自身的模式（ACP 模式 id，例如 plan 或 read-only）。空的 modes.agent 会保持智能体的默认模式。modes.plan 和 modes.ask 必须命名智能体的只读模式；没有它时，该模式下的轮次会被拒绝。
providers[].acp.modes.agent:
  en: The agent's mode while the session is in agent mode.
  zh: 会话处于 agent 模式时智能体的模式。
providers[].acp.modes.plan:
  en: The agent's mode while the session is in plan mode.
  zh: 会话处于 plan 模式时智能体的模式。
providers[].acp.modes.ask:
  en: The agent's mode while the session is in ask mode.
  zh: 会话处于 ask 模式时智能体的模式。
providers[].acp.idle_timeout_ms:
  en: Stop the agent process this long after its last call; the next call starts it again and replays the conversation into a new session. 0 (the default) means sixty minutes.
  zh: 在最后一次调用之后经过这么长时间就停止智能体进程；下一次调用会再次启动它，并将对话重放到新会话中。0（默认值）表示六十分钟。
providers[].acp.process:
  en: 'shared (the default): one agent process serves every session of this row, each in an ACP session of its own. per_session: every Coddy session gets an agent process of its own, for an agent that runs one prompt at a time per process (zcode-acp-server).'
  zh: shared（默认值）：一个智能体进程服务此行的每个会话，每个会话都在其自己的 ACP 会话中。per_session：每个 Coddy 会话都有自己的智能体进程，适用于每个进程一次只运行一个提示词的智能体（zcode-acp-server）。
models:
  en: Named model entries the agent and UI can select.
  zh: 智能体和界面可选择的有名称的模型条目。
models[].model:
  en: '"provider_name/api_model_id": the first path segment must match a providers[].name; the remainder is sent to the LLM API (may itself contain slashes).'
  zh: '"provider_name/api_model_id"：第一段路径必须匹配 providers[].name；其余部分发送到 LLM API（其本身可以包含斜杠）。'
models[].kimi_metadata:
  en: Kimi catalog protocol bound to this model reference, provider mode and region.
  zh: 绑定到此模型引用、提供商模式和区域的 Kimi 目录协议。
models[].kimi_metadata.model:
  en: Full provider/model reference listed in the catalog.
  zh: 目录中列出的完整 provider/model 引用。
models[].kimi_metadata.protocol:
  en: Protocol reported for this model.
  zh: 为此模型报告的协议。
models[].kimi_metadata.mode:
  en: Provider mode used to list the model.
  zh: 用于列出该模型的提供商模式。
models[].kimi_metadata.region:
  en: Provider region used to list the model.
  zh: 用于列出该模型的提供商区域。
models[].max_tokens:
  en: Upper bound on completion tokens per assistant message. A codex model never sends it (the Codex backend rejects max_output_tokens), so there it bounds nothing, and coddy -t and --dry-run warn about such a value.
  zh: 每条助手消息的补全令牌上限。codex 模型绝不会发送它（Codex 后端拒绝 max_output_tokens），因此在那里它不构成限制，coddy -t 和 --dry-run 会对这样的值发出警告。
models[].temperature:
  en: Sampling temperature (0 = deterministic; higher = more random).
  zh: 采样温度（0 = 确定性；越高 = 越随机）。
models[].max_context_tokens:
  en: 'Context window of the model in tokens: what the web UI context ring, the console context percentage and the automatic compaction trigger measure against. 0 reads it from the provider''s model listing when the provider reports one (the NeuralDeep hub, Anthropic, the Codex and Devin catalogs, vLLM, OpenRouter, LM Studio), else 128000.'
  zh: 模型的上下文窗口（以令牌计）：Web 界面上下文环、控制台上下文百分比和自动压缩触发器据此衡量。0 会在提供商报告时从提供商的模型列表中读取它（NeuralDeep hub、Anthropic、Codex 和 Devin 目录、vLLM、OpenRouter、LM Studio），否则为 128000。
models[].multimodal:
  en: Model accepts image/file inputs in addition to text; the UI shows a file attachment button for this model, and read shows it the picture in a PNG, JPEG, GIF or WebP file instead of refusing it as binary.
  zh: 除文本外，模型还接受图像/文件输入；界面会为此模型显示文件附件按钮，并且 read 会向它展示 PNG、JPEG、GIF 或 WebP 文件中的图片，而不是将其作为二进制拒绝。
models[].reasoning_levels:
  en: Override the reasoning levels offered for this model. Omit to auto-detect from the model id (gpt-5* -> minimal,low,medium,high; OpenAI o-series, gpt-oss*, qwen3*, and Claude extended-thinking models -> low,medium,high), the vendor an aggregator puts in front of it left out (qwen/qwen3.8-flash reads as qwen3.8-flash). An explicit empty list hides the selector. Settings fills this field from GET /coddy/config/reasoning-levels behind its Fetch reasoning levels button.
  zh: 覆盖为此模型提供的推理级别。省略则根据模型 id 自动检测（gpt-5* -> minimal,low,medium,high；OpenAI o 系列、gpt-oss*、qwen3* 和 Claude 扩展思考模型 -> low,medium,high），并去掉聚合器放在其前面的供应商（qwen/qwen3.8-flash 按 qwen3.8-flash 读取）。显式空列表会隐藏选择器。设置界面通过其 "Fetch reasoning levels" 按钮从 GET /coddy/config/reasoning-levels 填充此字段。
models[].reasoning_default:
  en: Reasoning level pre-selected for new chats; must be one of the resolved levels, otherwise ignored.
  zh: 为新聊天预选的推理级别；必须是解析出的级别之一，否则会被忽略。
models[].allow_reasoning_off:
  en: Expose Off in the reasoning selector for this model. Enable it only when this provider/model deployment honours Coddy's provider-specific request that disables reasoning; Coddy cannot verify that capability automatically.
  zh: 在此模型的推理选择器中显示 "Off"。仅当此提供商/模型部署遵循 Coddy 用于禁用推理的提供商特定请求时才启用它；Coddy 无法自动验证该能力。
models[].stream:
  en: Transport used to talk to this model. Omit (or true) to stream over SSE. false issues one blocking completion request and delivers the whole answer at once, for servers or proxies that handle event streams badly. Rejected for providers of type codex, whose backend is streaming-only.
  zh: 用于与此模型通信的传输方式。省略（或 true）以通过 SSE 流式传输。false 会发出一个阻塞式补全请求并一次性交付整个答案，适用于处理事件流不佳的服务器或代理。对于 type 为 codex 的提供商会拒绝，因为其后端仅支持流式传输。
models[].toolset:
  en: Name of the toolsets[] preset a session on this model is offered its tools by, unless the session picks another with /toolset <name>. Absent or empty offers every tool the mode would. Use it to spare a small-context local model the schemas of tools it never calls.
  zh: 此模型上的会话据以提供工具的 toolsets[] 预设名称，除非会话使用 /toolset <name> 选择另一个。不存在或为空则提供该模式会提供的每个工具。可使用它让小型上下文的本地模型免于接收其从不调用的工具的 schema。
toolsets:
  en: 'Named presets of tool lists. A models[] row names one with toolset, and a session can pick one with /toolset <name>, on its own or after /model on the same line. A preset only narrows: a tool the mode, a subagent definition or a switch already hides stays hidden, and a call to a tool outside the set is refused without a permission prompt. It is a context optimization, not a security boundary.'
  zh: 工具列表的具名预设。models[] 行通过 toolset 命名一个，会话可以使用 /toolset <name> 选择一个，既可单独使用，也可在同一行中跟在 /model 之后。预设只会收窄范围：模式、子智能体定义或开关已经隐藏的工具仍保持隐藏，对集合之外工具的调用会被拒绝且不会出现权限提示。它是上下文优化，不是安全边界。
toolsets[].name:
  en: 'Name of the preset: letters, digits, ''.'', ''_'' and ''-''. default is reserved: a session picks it to be offered every tool the mode offers.'
  zh: 预设名称：字母、数字、'.'、'_' 和 '-'。default 是保留名称：会话选择它会获得该模式提供的每个工具。
toolsets[].tools:
  en: 'Allowlist: tool names, a bare *, or a prefix* (context7__* admits every tool of that MCP server). Absent or empty admits every tool the mode would. coddy -t warns about an entry that matches no tool.'
  zh: 允许列表：工具名称、裸 *，或 prefix*（context7__* 允许该 MCP 服务器的每个工具）。不存在或为空则允许该模式会允许的每个工具。coddy -t 会对不匹配任何工具的条目发出警告。
toolsets[].disallowed_tools:
  en: Denylist applied after tools, with the same names and patterns; a name in both lists is removed. coddy -t warns about an entry that matches no tool.
  zh: 在 tools 之后应用的拒绝列表，使用相同的名称和模式；同时出现在两个列表中的名称会被移除。coddy -t 会对不匹配任何工具的条目发出警告。
agent:
  en: Defaults for the main agent loop (model id and safety caps).
  zh: 主智能体循环的默认值（模型 id 和安全上限）。
agent.queue_mode:
  en: 'Preferred queue mode for Enter during a running turn: steer joins the next ReAct step, after_turn starts a new turn after the current answer. When absent, interactive surfaces ask on first use.'
  zh: 运行中的轮次期间按 Enter 的首选排队模式：steer 加入下一个 ReAct 步骤，after_turn 在当前答案之后开始新轮次。不存在时，交互式界面会在首次使用时询问。
agent.model:
  en: Optional default models[].model id. Interactive surfaces (web UI, console) pick a model per session; unattended calls that name no model (coddy -p, coddy acp, API requests without a model selector) need it set - they report 'no model configured' when it is empty.
  zh: 可选的默认 models[].model id。交互式界面（Web 界面、控制台）按会话选择模型；未指定模型的无人值守调用（coddy -p、coddy acp、没有模型选择器的 API 请求）需要设置它，当它为空时它们会报告 "no model configured"。
agent.max_turns:
  en: Cap on the ReAct steps (LLM calls) of one prompt turn. Defaults to 165; set 0 to disable the cap. A turn that reaches the cap ends with a notice that names it.
  zh: 一个提示词轮次中 ReAct 步骤（LLM 调用）的上限。默认 165；设为 0 可禁用上限。达到上限的轮次会以一条指明该上限的通知结束。
agent.llm_retry_max:
  en: Extra attempts shared by transport retries, empty-answer recovery, first-token re-issues and output-limit recovery (a step cut off at max_tokens) until tool progress or a new follow-up. 0 disables these retries. Loop guards, Stop hooks, fallback models and quota-reset waits have separate limits.
  zh: 由传输重试、空答案恢复、首令牌重新发出和输出限制恢复（在 max_tokens 处被截断的步骤）共享的额外尝试次数，直到工具取得进展或出现新的后续消息。0 禁用这些重试。循环防护、Stop 钩子、回退模型和配额重置等待有各自独立的限制。
agent.llm_retry_base_ms:
  en: Initial backoff between LLM retries, in milliseconds. A server-provided pause (Retry-After-Ms / Retry-After headers, "Limit resets at" / "retry in Ns" body phrases) overrides the exponential backoff, capped at 60s.
  zh: LLM 重试之间的初始退避时间，以毫秒计。服务器提供的暂停（Retry-After-Ms / Retry-After 响应头、"Limit resets at" / "retry in Ns" 正文短语）会覆盖指数退避，上限为 60 秒。
agent.llm_min_interval_ms:
  en: Minimum gap between consecutive LLM calls in milliseconds, retry attempts included (0 disables pacing; e.g. 12000 on strict free tiers).
  zh: 连续 LLM 调用之间的最小间隔，以毫秒计，包括重试尝试（0 禁用节奏控制；例如在严格的免费套餐上为 12000）。
agent.llm_first_token_timeout_ms:
  en: 'How long a streamed LLM call may stay silent before the turn cancels it (the API hang guard). An explicit 0 disables the guard; blocking (stream: false) transports are never guarded.'
  zh: '流式 LLM 调用在被轮次取消之前可以保持静默多长时间（API 挂起防护）。显式 0 禁用该防护；阻塞式（stream: false）传输绝不会受到防护。'
agent.llm_stream_idle_timeout_ms:
  en: 'How long a streamed LLM response may send nothing after its first bytes before the stream is cut as stalled (the mid-answer hang guard): the text already delivered is kept and the turn ends with the stall named. An explicit 0 disables the guard; the wait for the first byte belongs to llm_first_token_timeout_ms, and blocking (stream: false) transports are never guarded.'
  zh: '流式 LLM 响应在发送其首批字节之后可以多长时间不发送任何内容，之后流会因停滞而被切断（答案中途挂起防护）：已交付的文本会保留，轮次会以指明停滞的方式结束。显式 0 禁用该防护；等待第一个字节属于 llm_first_token_timeout_ms，并且阻塞式（stream: false）传输绝不会受到防护。'
agent.loop_guard:
  en: 'Runaway-loop protection: cut a streamed response that degenerates into repeating itself, and block a tool called over and over with identical arguments.'
  zh: 失控循环防护：切断退化为自我重复的流式响应，并阻止使用相同参数反复调用的工具。
agent.loop_tool_repeat_limit:
  en: Consecutive identical tool calls in successive ReAct responses (same name, same canonical arguments) before the loop guard steps in. 0 disables the tool-repeat check.
  zh: 在循环防护介入之前，连续 ReAct 响应中连续出现的相同工具调用（相同名称、相同规范参数）的次数。0 禁用工具重复检查。
agent.loop_stream_repeat_cycles:
  en: Identical back-to-back output cycles inside one streamed response before the stream is cut. 0 disables the stream check.
  zh: 在一个流式响应内，流被切断之前连续相同的输出周期数。0 禁用流检查。
agent.loop_nudge_max:
  en: How many times one turn may be nudged back on track before the loop guard stops it with a notice.
  zh: 在一个轮次被循环防护以通知停止之前，可以多少次将其推回正轨。
agent.wait_for_limit_reset:
  en: Wait for a hit usage limit to lift and re-issue the call, instead of ending the turn with the provider's error. Applies to a top-level turn whose provider names a pause beyond the retry budget, in a Retry-After header or in the text of the 429 itself; the turn lock and the client stream stay open while it waits, so it is off by default.
  zh: 等待已触发的用量限制解除并重新发出调用，而不是以提供商的错误结束轮次。适用于顶层轮次，其提供商在 Retry-After 响应头或 429 本身的文本中指定了超出重试预算的暂停；等待期间轮次锁和客户端流保持打开，因此默认关闭。
agent.wait_for_limit_reset_max_ms:
  en: Longest time one turn spends waiting for limits in total, in milliseconds, the retry wrapper's own sleeps on a limit included; a pause that would exceed it ends the turn at once with the error. An explicit 0 never waits.
  zh: 一个轮次等待限制所花费的最长时间总计，以毫秒计，包括重试包装器自身因限制而进行的休眠；超过该时间的暂停会立即以错误结束轮次。显式 0 表示从不等待。
prompts:
  en: Override the built-in system prompt templates (Go text/template).
  zh: 覆盖内置系统提示词模板（Go text/template）。
prompts.dir:
  en: Directory containing prompt template files. Empty uses embedded defaults. Supports ~ and ${CWD} (session cwd at render time).
  zh: 包含提示词模板文件的目录。为空时使用内嵌默认值。支持 ~ 和 ${CWD}（渲染时的会话 cwd）。
prompts.agent_prompt:
  en: File name inside prompts.dir for agent mode.
  zh: prompts.dir 中用于 agent 模式的文件名。
prompts.plan_prompt:
  en: File name inside prompts.dir for plan mode.
  zh: prompts.dir 中用于 plan 模式的文件名。
prompts.ask_prompt:
  en: File name inside prompts.dir for ask mode.
  zh: prompts.dir 中用于 ask 模式的文件名。
instructions:
  en: 'Files the operator adds to the system prompt (AGENTS.md convention), after the documents every session reads anyway: the AGENTS.md and DESIGN.md of the agent home, then those of the session folder, and the nested ones of a folder a tool enters, none of which is named here or can be turned off. A file already in the prompt is not read twice. See https://coddy.dev/docs/features/rules.'
  zh: 操作者添加到系统提示词的文件（AGENTS.md 约定），位于每个会话本来就会读取的文档之后：先是智能体主目录的 AGENTS.md 和 DESIGN.md，然后是会话文件夹中的这些文件，再是工具进入的文件夹中的嵌套文件，这些文件都没有在此命名，也无法关闭。提示词中已有的文件不会被读取两次。参见 https://coddy.dev/docs/features/rules。
instructions.files:
  en: Extra instruction files, appended after the AGENTS.md and DESIGN.md documents in the order listed; empty by default. ${CODDY_HOME}, ${CWD} and a leading ~ expand; an absolute entry is read as it stands, a relative one resolves against the session CWD. An entry naming a document the prompt already carries is skipped.
  zh: 额外的指令文件，按列出的顺序追加在 AGENTS.md 和 DESIGN.md 文档之后；默认空。${CODDY_HOME}、${CWD} 和开头的 ~ 会展开；绝对路径条目按原样读取，相对条目则相对于会话 CWD 解析。命名了提示词已包含的文档的条目会被跳过。
skills:
  en: Directories scanned for skills (SKILL.md and root .md/.mdc files).
  zh: 扫描技能的目录（SKILL.md 和根目录下的 .md/.mdc 文件）。
skills.dirs:
  en: 'Extra skill directories, read after the four default folders and stronger than them. The defaults are always read, lowest priority first: ${HOME}/.agents/skills (shared with every agent, npx skills and npx skillsbd install there), the project''s .agents/skills, ${CODDY_HOME}/skills (Coddy''s own and installed skills), the project''s .coddy/skills; then these entries in their order. A skill found in several directories is taken from the last one in this order, and a directory named twice is read at its last place. ${CODDY_HOME} expands when the file is loaded, ${HOME} and ~ to your home folder, ${CWD} and a relative path against the session''s workspace (the folder a new chat picked included).'
  zh: 额外的技能目录，在四个默认文件夹之后读取，并且优先级高于它们。默认文件夹始终会被读取，优先级从低到高：${HOME}/.agents/skills（与每个智能体共享，npx skills 和 npx skillsbd 会安装到那里）、项目的 .agents/skills、${CODDY_HOME}/skills（Coddy 自带的技能和已安装的技能）、项目的 .coddy/skills；然后按顺序读取这些条目。在多个目录中发现的技能会从此顺序中的最后一个目录获取，重复命名的目录会在其最后出现的位置读取。${CODDY_HOME} 在加载文件时展开，${HOME} 和 ~ 展开到你的主文件夹，${CWD} 和相对路径相对于会话的工作区（包括新聊天所选的文件夹）。
skills.project_trust:
  en: 'Trust policy for the project''s .coddy/marketplaces.json, which travels with the checkout: "ask" (default) leaves its sources and marketplaces out of every sync until the operator approves that exact entry for that workspace; "allow" treats them like the operator''s own ${CODDY_HOME}/marketplaces.json; "deny" never uses them (they are listed as switched off). What they install goes to ${CODDY_HOME}/skills. The project''s skill folders (.coddy/skills, .agents/skills) are not affected. Skill marketplaces are not declared in config.yaml: they live in ${CODDY_HOME}/marketplaces.json and the project''s .coddy/marketplaces.json, and an old skills.sources list is moved into the home file on load. See https://coddy.dev/docs/features/skills#project-marketplaces-and-trust.'
  zh: 项目 .coddy/marketplaces.json 的信任策略，该文件会随检出一起传递："ask"（默认）会将其来源和市场排除在每次同步之外，直到操作者为该工作区批准该确切条目；"allow" 会像对待操作者自己的 ${CODDY_HOME}/marketplaces.json 一样对待它们；"deny" 从不使用它们（它们会列为已关闭）。它们安装的内容会进入 ${CODDY_HOME}/skills。项目的技能文件夹（.coddy/skills、.agents/skills）不受影响。技能市场不在 config.yaml 中声明：它们位于 ${CODDY_HOME}/marketplaces.json 和项目的 .coddy/marketplaces.json 中，旧的 skills.sources 列表会在加载时移入主目录文件。参见 https://coddy.dev/docs/features/skills#project-marketplaces-and-trust。
skills.auto_discovery:
  en: Offer the model-driven load_skill tool so the agent pulls a catalogued skill's full instructions into a turn on its own when the request matches, instead of requiring an explicit /name. Defaults to true.
  zh: 提供由模型驱动的 load_skill 工具，使智能体在请求匹配时自行将目录中技能的完整指令拉入轮次，而不是要求显式的 /name。默认为 true。
rules:
  en: Discovery of rule files from ${CODDY_HOME}/rules (the operator's own, applied in every workspace) and from one project folder under the session CWD, the first of .coddy/rules, .agents/rules, .cursor/rules, .claude/rules, .codex/rules that holds a rule file, and the same way under every subfolder on the way down to a file a tool or a mention reaches, each of those rules applying to its own subfolder; .mdc files are Cursor rules, .md files Claude Code rules. The AGENTS.md and DESIGN.md documents are not rules in this sense and none of these settings turns them off. See https://coddy.dev/docs/features/rules.
  zh: 从 ${CODDY_HOME}/rules（操作者自己的规则，在每个工作区中应用）以及从会话 CWD 下的一个项目文件夹中发现规则文件，该文件夹是 .coddy/rules、.agents/rules、.cursor/rules、.claude/rules、.codex/rules 中第一个包含规则文件的文件夹，并且在向下到达工具或提及所及文件的路径上的每个子文件夹中都采用相同方式，这些规则各自应用于其自己的子文件夹；.mdc 文件是 Cursor 规则，.md 文件是 Claude Code 规则。AGENTS.md 和 DESIGN.md 文档在此意义上不是规则，这些设置也不会关闭它们。参见 https://coddy.dev/docs/features/rules。
rules.auto_discover:
  en: 'Scan the rule folders automatically: ${CODDY_HOME}/rules, the project folder of the session CWD and those of the subfolders a tool or a mention reaches. The AGENTS.md and DESIGN.md documents are read either way.'
  zh: 自动扫描规则文件夹：${CODDY_HOME}/rules、会话 CWD 的项目文件夹，以及工具或提及所及子文件夹的规则文件夹。AGENTS.md 和 DESIGN.md 文档无论哪种方式都会被读取。
rules.systems:
  en: 'Restrict which rule systems are loaded: user (${CODDY_HOME}/rules), coddy, agents-dir (.agents/rules), cursor, claude, codex. Empty means all. A project folder left out drops out of the chain; of the ones admitted, the first that holds a rule file is read. agents, which used to switch the nested AGENTS.md files, no longer affects them (they are always read); it is still accepted, and a list holding only agents loads no rule folder.'
  zh: 限制加载哪些规则系统：user（${CODDY_HOME}/rules）、coddy、agents-dir（.agents/rules）、cursor、claude、codex。空表示全部。被排除的项目文件夹会从链中移除；在允许的文件夹中，读取第一个包含规则文件的文件夹。agents 过去用于切换嵌套的 AGENTS.md 文件，现在不再影响它们（它们始终会被读取）；它仍会被接受，而仅包含 agents 的列表不会加载任何规则文件夹。
mcp:
  en: MCP settings that are not tied to a single server entry.
  zh: 不绑定到单个服务器条目的 MCP 设置。
mcp.project_trust:
  en: 'Trust policy for the project-local <cwd>/.coddy/mcp.json, which travels with the checkout: "ask" keeps its servers cold until the operator approves that exact declaration for that workspace; "allow" starts them automatically (trusted workspaces only); "deny" never loads them.'
  zh: 项目本地 <cwd>/.coddy/mcp.json 的信任策略，该文件随检出一起携带："ask" 让其中的服务器保持冷状态，直到操作者针对该工作区批准该确切声明；"allow" 自动启动它们（仅限受信任的工作区）；"deny" 永不加载它们。
mcp.idle_timeout_seconds:
  en: 'Seconds an MCP server that no session holds any more keeps running before Coddy stops it: a project server once the last session of its workspace let it go, a server an ACP client sent once the last session that sent it closed. A session that takes the server in the meantime finds it running. The global servers that coddy serve, the console and coddy acp start with the process are not affected, and a server switched off, no longer approved, removed or declared differently stops at once. 0 stops a server as soon as the last session lets it go.'
  zh: 不再被任何会话持有的 MCP 服务器在 Coddy 停止它之前继续运行的秒数：项目服务器在其工作区的最后一个会话释放它之后，ACP 客户端发送的服务器在发送它的最后一个会话关闭之后。在此期间接管该服务器的会话会发现它仍在运行。随进程启动的 coddy serve、console 和 coddy acp 的全局服务器不受影响，而被关闭、不再获批、被移除或以不同方式声明的服务器会立即停止。0 表示最后一个会话释放后立即停止该服务器。
tools:
  en: Filesystem and shell policy for built-in tools.
  zh: 内置工具的文件系统与 shell 策略。
tools.command_allowlist:
  en: Commands that never require permission. An entry covers its command exactly or with arguments after a space; a line of several commands (&&, ||, ;, &, a pipe, a newline) runs without a prompt only when each of them is covered, and command substitution or a redirection always asks. On PowerShell and cmd.exe an entry covers only a command without operators. "*" allows all commands.
  zh: 永远不需要权限的命令。一个条目精确覆盖其命令，或以空格后跟参数的形式覆盖；一行中的多条命令（&&、||、;、&、管道、换行）只有在每一条都被覆盖时才无提示运行，而命令替换或重定向总是会询问。在 PowerShell 和 cmd.exe 上，一个条目只覆盖不含操作符的命令。"*" 允许所有命令。
tools.ssh_connect_timeout:
  en: TCP dial timeout for SSH connections (ssh_run_command tool), in seconds.
  zh: SSH 连接（ssh_run_command 工具）的 TCP 拨号超时，单位为秒。
tools.output_limits:
  en: Maximum lines each tool result or error may return into the LLM context. Every enabled limit also applies a 64 KiB per-call byte safety ceiling so a huge single line cannot bypass it. 0 disables both limits for that tool. Unset fields fall back to the built-in defaults.
  zh: 每个工具结果或错误可返回进 LLM 上下文的最大行数。每个启用的限制还会施加每次调用 64 KiB 的字节安全上限，使超长的单行无法绕过它。0 为该工具禁用两项限制。未设置的字段回退到内置默认值。
tools.output_limits.read:
  en: Max lines for a read file page or directory listing.
  zh: 读取文件分页或目录列表的最大行数。
tools.output_limits.grep:
  en: Max path:line:content records returned by grep.
  zh: grep 返回的 path:line:content 记录的最大数量。
tools.output_limits.glob:
  en: Max paths returned by glob.
  zh: glob 返回的路径的最大数量。
tools.output_limits.print_tree:
  en: Max lines of a directory tree.
  zh: 目录树的最大行数。
tools.output_limits.run_command:
  en: Max combined stdout+stderr lines of a shell command.
  zh: shell 命令合并的 stdout+stderr 最大行数。
tools.output_limits.ssh_run_command:
  en: Max combined stdout+stderr lines of a remote SSH command.
  zh: 远程 SSH 命令合并的 stdout+stderr 最大行数。
tools.output_limits.webfetch:
  en: Max lines of fetched page markdown.
  zh: 抓取页面 markdown 的最大行数。
tools.output_limits.websearch:
  en: Max lines of search results.
  zh: 搜索结果的最大行数。
tools.output_limits.default:
  en: Applies to any tool not named above, including MCP tools. 0 means unlimited.
  zh: 适用于上面未列出的任何工具，包括 MCP 工具。0 表示不限。
tools.background:
  en: Commands the agent runs detached in the session task pool instead of blocking a turn. The pool dies with the coddy process; each task's metadata and captured output stay in the session bundle, and a task interrupted by a restart is reported as orphaned.
  zh: 智能体在会话任务池中以分离方式运行、而不阻塞轮次的命令。任务池随 coddy 进程一同终止；每个任务的元数据与捕获的输出保留在会话包中，被重启中断的任务会报告为孤立。
tools.background.enable:
  en: Offer the background option on run_command and expose the background task tools.
  zh: 在 run_command 上提供后台选项，并暴露后台任务工具。
tools.background.max_concurrent:
  en: How many background tasks one session may run at once. 0 uses the default.
  zh: 一个会话可同时运行的后台任务数量。0 使用默认值。
tools.background.default_timeout_seconds:
  en: Hard limit for a task started without an explicit timeout and without a duration estimate. 0 uses the default.
  zh: 对未显式指定超时且无时长估算的任务的硬性限制。0 使用默认值。
tools.background.max_timeout_seconds:
  en: Ceiling applied to any requested or estimate-derived timeout. 0 uses the default.
  zh: 施加到任何请求的或由估算得出的超时上的上限。0 使用默认值。
tools.background.output_buffer_bytes:
  en: How much of each task's output stays in memory for the status ticker. The full log is still written to the session bundle. 0 uses the default.
  zh: 每个任务的输出有多少保留在内存中供状态指示器使用。完整日志仍会写入会话包。0 使用默认值。
tools.canvas:
  en: 'The canvas of the web UI: a .canvas file of the workspace shown in the Files window as a board of live frames, each a page of the workspace running in a sandbox, put there by the agent with canvas_show or by the person from the Files window; canvas_inspect reads what the browser saw. See https://coddy.dev/docs/features/canvas.'
  zh: Web 界面的画布：工作区的 .canvas 文件在“文件”窗口中显示为一块由实时 frame 组成的板，每个 frame 都是工作区的一个页面，运行在沙箱中，由智能体通过 canvas_show 放入，或由用户从“文件”窗口放入；canvas_inspect 读取浏览器所看到的内容。参见 https://coddy.dev/docs/features/canvas。
tools.canvas.enable:
  en: Offer the canvas_show and canvas_inspect tools, serve frames and show the canvas in the web UI.
  zh: 提供 canvas_show 和 canvas_inspect 工具，提供 frame 服务并在 Web 界面中显示画布。
tools.canvas.allow_cdn:
  en: 'Let a frame load libraries, styles and fonts from the common CDNs: cdn.jsdelivr.net, unpkg.com, cdnjs.cloudflare.com, cdn.tailwindcss.com, fonts.googleapis.com and fonts.gstatic.com.'
  zh: 允许 frame 从常见 CDN 加载库、样式和字体：cdn.jsdelivr.net、unpkg.com、cdnjs.cloudflare.com、cdn.tailwindcss.com、fonts.googleapis.com 和 fonts.gstatic.com。
tools.canvas.allowed_sources:
  en: Further hosts a frame may load from and connect to, as https://host or https://*.host with an optional port and path. A page on the canvas can send what it reads under its folder to any of them.
  zh: frame 可以从中加载和连接的更多主机，形式为 https://host 或 https://*.host，可带可选的端口和路径。画布上的页面可以将其文件夹下读取到的内容发送给其中任何一个。
tools.preview_server:
  en: 'The preview_server tool: a static file server the agent starts over a project directory, on a free port, so the operator can open HTML, JS and CSS work in a browser. The server is a background task of the session and runs until it is stopped, the session is deleted or coddy exits.'
  zh: preview_server 工具：智能体在项目目录上以空闲端口启动的静态文件服务器，使操作者可以在浏览器中打开 HTML、JS 和 CSS 成果。该服务器是会话的后台任务，运行到被停止、会话被删除或 coddy 退出为止。
tools.preview_server.enable:
  en: 'Offer the preview_server tool. The server is a background task, so tools.background.enable: false turns it off as well.'
  zh: '提供 preview_server 工具。该服务器是后台任务，因此 tools.background.enable: false 也会将它关闭。'
tools.preview_server.host:
  en: 'Address the server binds, without a port: the port is always a free one. Anything that is not loopback exposes the served directory to whoever can reach that address.'
  zh: 服务器绑定的地址，不含端口：端口始终是空闲端口。任何非回环地址都会把所服务的目录暴露给能够访问该地址的人。
tools.preview_server.public_host:
  en: Host written into the URL the agent hands out, for a coddy that runs where the operator's browser is not (a container, a remote machine). Empty uses the bind host.
  zh: 写入智能体所分发 URL 中的主机，用于运行在操作者浏览器之外（容器、远程机器）的 coddy。为空则使用绑定主机。
tools.websearch:
  en: Which search engines the websearch tool asks, in what order their results merge, and what it may spend asking them. Each engine reports its own outcome next to the results, so a blocked backend is named rather than counted as "the web has nothing".
  zh: websearch 工具询问哪些搜索引擎、其结果按什么顺序合并，以及它可为询问它们花费什么。每个引擎都在结果旁报告自己的结果，因此被阻止的后端会被点名，而不是被算作“网上没有内容”。
tools.websearch.engines:
  en: 'Search engines to ask, in merge order. Unset asks brave then bing. "ddg" and "google" are not asked by default: measured from a server, DuckDuckGo answers every query with an anti-bot interstitial and Google renders its results in the browser. "searxng" needs searxng_url.'
  zh: 要询问的搜索引擎，按合并顺序排列。未设置时先询问 brave 再询问 bing。默认不询问 "ddg" 和 "google"：从服务器上实测，DuckDuckGo 对每个查询都返回反机器人插页，而 Google 在浏览器中渲染其结果。"searxng" 需要 searxng_url。
tools.websearch.engine_timeout_seconds:
  en: Seconds one engine may take before it is reported as unavailable. 0 uses the default.
  zh: 一个引擎在被报告为不可用之前可花费的秒数。0 使用默认值。
tools.websearch.total_timeout_seconds:
  en: Seconds the whole search may take, however many engines it asks. 0 uses the default.
  zh: 整个搜索可花费的秒数，无论询问多少个引擎。0 使用默认值。
tools.websearch.max_concurrent_engines:
  en: How many engines are asked at once. 0 uses the default.
  zh: 同时询问多少个引擎。0 使用默认值。
tools.websearch.snippet_chars:
  en: Maximum characters of one result description. 0 uses the default.
  zh: 单条结果描述的最大字符数。0 使用默认值。
tools.websearch.cache_ttl_seconds:
  en: Seconds one engine answer is reused before the engine is asked again, so a repeated search does not repeat the request. 0 uses the default; a negative value turns caching off.
  zh: 一个引擎的回答在被再次询问之前可复用的秒数，使重复搜索不会重复发送请求。0 使用默认值；负值会关闭缓存。
tools.websearch.searxng_url:
  en: Base address of your own SearXNG instance, asked over its JSON API (enable the json format in its settings.yml). A self-hosted aggregator is the durable answer to a scraped engine being turned away; localhost and LAN addresses are allowed on purpose.
  zh: 你自己的 SearXNG 实例的基础地址，通过其 JSON API 询问（在其 settings.yml 中启用 json 格式）。自托管的聚合器是被抓取的引擎遭拒时的持久答案；localhost 和局域网地址是特意允许的。
tools.websearch.brave_api_key:
  en: Brave Search API subscription token. With it the brave engine uses the official JSON API instead of reading the public result page, which has no parser to break when Brave redeploys. Empty reads the BRAVE_API_KEY environment variable (also from ${CODDY_HOME}/.env), so the key need not be stored here.
  zh: Brave Search API 订阅令牌。有它时 brave 引擎使用官方 JSON API 而非读取公开结果页面，后者在 Brave 重新部署时没有可破坏的解析器。为空则读取 BRAVE_API_KEY 环境变量（也包括来自 ${CODDY_HOME}/.env 的），因此密钥无需存储在此处。
tools.websearch.deepseek_api_key:
  en: DeepSeek Search API key. The deepseek engine asks DeepSeek's Search API (POST /v1/tools/search), which has no public page to scrape, so without a key the engine is unavailable. Empty reads the DEEPSEEK_API_KEY environment variable (also from ${CODDY_HOME}/.env), so the key need not be stored here.
  zh: DeepSeek Search API 密钥。deepseek 引擎询问 DeepSeek 的 Search API（POST /v1/tools/search），它没有可抓取的公开页面，因此没有密钥时该引擎不可用。为空则读取 DEEPSEEK_API_KEY 环境变量（也包括来自 ${CODDY_HOME}/.env 的），因此密钥无需存储在此处。
tools.http_request:
  en: 'Policy of the http_request tool, the agent''s curl: the destinations it reaches without asking and the headers every request sends. Under the ask and accept_edits permission modes a request asks the operator unless its destination is allowed here or was approved in the session; bypass never asks. See https://coddy.dev/docs/features/http-requests.'
  zh: http_request 工具（智能体的 curl）的策略：它无需询问即可到达的目的地，以及每个请求都会发送的请求头。在 ask 和 accept_edits 权限模式下，除非请求的目的地已在此处允许或在会话中获批，否则会询问操作者；bypass 从不询问。参见 https://coddy.dev/docs/features/http-requests。
tools.http_request.allowlist:
  en: 'Destinations a request reaches without asking: a host (api.github.com), a subdomain wildcard (*.example.com), either with an optional :port, an origin (http://localhost:8080) or an address prefix (https://api.example.com/v1/). "*" allows every destination. An entry also covers the files a request uploads and an unchecked certificate; a proxy needs an entry of its own, and a file the response is saved to follows the write policy.'
  zh: 请求无需询问即可到达的目的地：主机（api.github.com）、子域通配符（*.example.com），二者均可带可选的 :port，或来源（http://localhost:8080），或地址前缀（https://api.example.com/v1/）。"*" 允许所有目的地。一个条目还覆盖请求上传的文件和未校验的证书；代理需要自己的条目，而响应保存到的文件遵循写入策略。
tools.http_request.default_headers:
  en: 'Headers every http_request call sends unless the call names the header itself: a browser User-Agent for a site that turns tools away, an Accept an internal service expects. They take the place of the tool''s own defaults (its coddy-agent User-Agent), a call''s headers take the place of them - an empty value in the call removes one - and an empty value here leaves the header out of every call that does not set it. A name is letters, digits, - and _, starting with a letter. Host, Content-Type, Content-Length and Transfer-Encoding describe a single request and are refused, and so are the hop-by-hop headers (Connection, Keep-Alive, Proxy-Connection, TE, Trailer, Upgrade) and Proxy-Authorization, which an https request would carry through the proxy''s tunnel to every origin. The headers go to every destination the tool reaches, so a credential here reaches all of them; the permission prompt names them and shows the value only of one that describes the client (User-Agent, Accept...), config_get
    keeps their values from the model, and webfetch, URL mentions and the model providers never send them. See https://coddy.dev/docs/features/http-requests#default-headers.'
  zh: 每次 http_request 调用都会发送的请求头，除非调用自身指定了该请求头：针对拒绝工具的站点的浏览器 User-Agent，内部服务所期望的 Accept。它们取代工具自身的默认值（其 coddy-agent User-Agent），调用的请求头取代它们 - 调用中的空值会移除其一 - 而此处的空值会让该请求头不出现在每个未设置它的调用中。名称由字母、数字、- 和 _ 组成，以字母开头。Host、Content-Type、Content-Length 和 Transfer-Encoding 描述单个请求，会被拒绝，逐跳请求头（Connection、Keep-Alive、Proxy-Connection、TE、Trailer、Upgrade）以及 Proxy-Authorization 同样会被拒绝，因为 https 请求会经由代理隧道把它们带到每个来源。这些请求头会发往该工具到达的每个目的地，因此此处的凭据会到达所有目的地；权限提示会点名它们，并仅显示描述客户端的那一个（User-Agent、Accept……）的值，config_get 会对模型隐藏它们的值，而 webfetch、URL 提及和模型提供商从不发送它们。参见 https://coddy.dev/docs/features/http-requests#default-headers。
subagents:
  en: User-defined child agents the model can delegate to with spawn_agent. Definitions are markdown files with YAML frontmatter; each run is a background task of the parent session with its own child session and transcript. See https://coddy.dev/docs/features/subagents.
  zh: 用户定义的子智能体，模型可通过 spawn_agent 委派给它。定义是带 YAML frontmatter 的 markdown 文件；每次运行都是父会话的一个后台任务，拥有自己的子会话和对话记录。参见 https://coddy.dev/docs/features/subagents。
subagents.enable:
  en: Register the spawn_agent tool and list the subagent catalog in the system prompt.
  zh: 注册 spawn_agent 工具，并在系统提示词中列出子智能体目录。
subagents.dirs:
  en: 'Extra definition directories, read after the four default folders and stronger than them. The defaults are always read, lowest priority first: ${HOME}/.agents/agents, the project''s .agents/agents, ${CODDY_HOME}/agents, the project''s .coddy/agents; then these entries in their order. A definition found in several directories is taken from the last one in this order, and a directory named twice is read at its last place. ${CODDY_HOME} expands when the file is loaded, ${HOME} and ~ to your home folder, ${CWD} and a relative path against the session''s workspace. Directories inside the workspace are project scope and follow the trust policy.'
  zh: 额外的定义目录，在四个默认文件夹之后读取，且优先级高于它们。默认目录始终会被读取，优先级从低到高：${HOME}/.agents/agents、项目的 .agents/agents、${CODDY_HOME}/agents、项目的 .coddy/agents；然后是这些条目，按其顺序。在多个目录中找到的同一定义，取此顺序中的最后一个，重复列出的目录在其最后出现的位置读取。${CODDY_HOME} 在加载文件时展开，${HOME} 和 ~ 展开为你的主文件夹，${CWD} 和相对路径相对于会话的工作区解析。工作区内的目录属于项目范围，遵循信任策略。
subagents.project_trust:
  en: 'Trust policy for definitions found inside the workspace, which travel with the checkout: "ask" loads them but refuses to spawn one until the operator approved that exact file for that workspace (the shield in Settings -> Subagents, coddy agents trust on the machine running coddy, or POST /coddy/subagents/{name}/trust with the session workspace as cwd); "allow" treats them like the operator''s own files; "deny" never reads them.'
  zh: 在工作区内找到的定义的信任策略，这些定义随检出一起携带："ask" 加载它们，但在操作者针对该工作区批准该确切文件之前拒绝启动（设置 -> 子智能体中的盾牌、在运行 coddy 的机器上执行 coddy agents trust，或用会话工作区作为 cwd 调用 POST /coddy/subagents/{name}/trust）；"allow" 将它们视同操作者自己的文件；"deny" 永不读取它们。
subagents.max_concurrent:
  en: How many subagent runs the whole process may have in flight at once, whatever session started them. Starting past the limit is refused, not queued. 0 uses the default.
  zh: 整个进程可同时处于运行中的子智能体运行数量，无论由哪个会话启动。超过限制的启动会被拒绝，而不是排队。0 使用默认值。
subagents.max_depth:
  en: 'How deep spawning may nest: 1 lets a session spawn subagents that cannot spawn further; 0 forbids spawning everywhere. Omit for the default.'
  zh: 启动可嵌套的深度：1 允许会话启动子智能体，但后者不能再启动；0 在所有地方禁止启动。省略则使用默认值。
subagents.default_timeout_seconds:
  en: Hard limit for one run whose definition and call give no timeout. Capped by tools.background.max_timeout_seconds. 0 uses the default.
  zh: 对定义和调用都未给出超时的单次运行的硬性限制。受 tools.background.max_timeout_seconds 限制。0 使用默认值。
subagents.max_turns:
  en: ReAct rounds a child may take. 0 follows agent.max_turns.
  zh: 子智能体可执行的 ReAct 轮数。0 则遵循 agent.max_turns。
hooks:
  en: 'Operator commands run at lifecycle points of a session: before and after a tool call, when a prompt is submitted, when the agent stops, on session start and around compaction. Definitions are JSON files in the Claude Code shape (~/.coddy/hooks.json, .coddy/hooks.json, .claude/settings*.json). See https://coddy.dev/docs/features/hooks.'
  zh: 在会话生命周期节点运行的操作者命令：工具调用前后、提交提示词时、智能体停止时、会话开始时以及压缩前后。定义是 Claude Code 形态的 JSON 文件（~/.coddy/hooks.json、.coddy/hooks.json、.claude/settings*.json）。参见 https://coddy.dev/docs/features/hooks。
hooks.enable:
  en: Load and run hooks at all.
  zh: 是否加载并运行钩子。
hooks.files:
  en: Definition files, lowest priority first; every matching hook runs. ${CODDY_HOME} and ${CWD} expand; a relative entry resolves against the session cwd. Files inside the workspace are project scope and follow project_trust; only the hooks key of a Claude Code settings file is read.
  zh: 定义文件，优先级从低到高；每个匹配的钩子都会运行。${CODDY_HOME} 和 ${CWD} 会展开；相对条目相对于会话 cwd 解析。工作区内的文件属于项目范围，遵循 project_trust；Claude Code 设置文件中只读取 hooks 键。
hooks.project_trust:
  en: 'Trust policy for hook files found inside the workspace, which travel with the checkout: "ask" lists them but runs nothing until the operator approved that exact file for that workspace on the machine running coddy (coddy hooks trust there, or POST /coddy/hooks/trust with the session workspace as cwd); "allow" treats them like the operator''s own file; "deny" never reads them.'
  zh: 在工作区内找到的钩子文件的信任策略，这些文件随检出一起携带："ask" 列出它们，但在操作者在运行 coddy 的机器上针对该工作区批准该确切文件之前不运行任何内容（在那里执行 coddy hooks trust，或用会话工作区作为 cwd 调用 POST /coddy/hooks/trust）；"allow" 将它们视同操作者自己的文件；"deny" 永不读取它们。
hooks.default_timeout_seconds:
  en: Hard limit for one hook process whose definition gives no timeout. 0 uses the default.
  zh: 对定义未给出超时的单个钩子进程的硬性限制。0 使用默认值。
hooks.stop_loop_limit:
  en: How many times per turn a Stop hook may send the agent back to work. 0 uses the default.
  zh: 每轮中 Stop 钩子可让智能体重新工作的次数。0 使用默认值。
hooks.max_output_chars:
  en: Cap on the context, messages and reasons one hook may hand to the model or the user; longer values are truncated with a marker. 0 uses the default.
  zh: 单个钩子可交给模型或用户的上下文、消息和理由的上限；更长的值会被截断并加标记。0 使用默认值。
logger:
  en: Process log level, outputs, format, and file rotation.
  zh: 进程日志级别、输出、格式和文件轮转。
logger.level:
  en: Minimum severity written to the configured outputs ("warning" is accepted as an alias of "warn").
  zh: 写入已配置输出的最低严重级别（"warning" 可作为 "warn" 的别名接受）。
logger.levels:
  en: Per-component minimum severity. A component is the dotted name a record carries in its "component" attribute (gateway, gateway.telegram, gateway.pachca, session, agent, scheduler, provider.acp); a parent name covers everything nested under it and the longest configured prefix wins. Records with no component follow "level".
  zh: 按组件的最低严重级别。组件是记录在其 "component" 属性中携带的点分名称（gateway、gateway.telegram、gateway.pachca、session、agent、scheduler、provider.acp）；父名称覆盖其下嵌套的一切，最长的已配置前缀优先。没有组件的记录遵循 "level"。
logger.levels[].component:
  en: Dotted component name, for example "gateway.telegram".
  zh: 点分组件名称，例如 "gateway.telegram"。
logger.levels[].level:
  en: Minimum severity for this component.
  zh: 该组件的最低严重级别。
logger.outputs:
  en: Where log records go; any combination of stdout, stderr, file. Empty means stderr only.
  zh: 日志记录的去向；stdout、stderr、file 的任意组合。为空表示仅 stderr。
logger.file:
  en: Path for the file sink; required when outputs includes "file". Supports ${CODDY_HOME}.
  zh: 文件接收器的路径；当 outputs 包含 "file" 时为必填。支持 ${CODDY_HOME}。
logger.format:
  en: Log record format.
  zh: 日志记录格式。
logger.rotation:
  en: Size-based rotation for the file sink.
  zh: 文件接收器的基于大小的轮转。
logger.rotation.max_size_mb:
  en: Rotate after the file reaches this size in MB; 0 disables size-based rotation.
  zh: 文件达到此大小（MB）后轮转；0 禁用基于大小的轮转。
logger.rotation.max_files:
  en: Rotated backups to keep when max_size_mb > 0.
  zh: max_size_mb > 0 时保留的轮转备份数量。
sessions:
  en: Where persisted session bundles are stored.
  zh: 持久化会话包的存储位置。
sessions.dir:
  en: Sessions root directory. Empty resolves to ${CODDY_HOME}/sessions. Supports ${CODDY_HOME} and ~.
  zh: 会话根目录。为空则解析为 ${CODDY_HOME}/sessions。支持 ${CODDY_HOME} 和 ~。
compaction:
  en: Summarizes older conversation history so long sessions keep fitting the model context window. Manual compact command plus automatic trigger at a percent of the model's context window.
  zh: 总结较早的对话历史，使长会话持续适配模型的上下文窗口。手动压缩命令，加上在模型上下文窗口某一百分比处自动触发。
compaction.enable:
  en: Master switch for compaction (manual command and automatic trigger). Defaults to true.
  zh: 压缩的总开关（手动命令和自动触发）。默认为 true。
compaction.auto_enable:
  en: 'Compact automatically: at threshold_percent, older turns are folded into a summary, or, when the window holds no earlier turn, the earlier steps of the turn being answered (the summary row then starts with the prompt itself, verbatim, and at most the four latest steps stay); and a request the provider refuses as larger than its context window is compacted once and asked again. Set false to keep manual /compact and the Context popover action available without any of this. Defaults to true.'
  zh: 自动压缩：达到 threshold_percent 时，较早的轮次被折叠为摘要，或者，当窗口中没有更早的轮次时，折叠正在回答的这一轮的较早步骤（此时摘要行以提示词本身逐字开头，最多保留最近四个步骤）；以及提供商以超出其上下文窗口为由拒绝的请求会被压缩一次并再次询问。设为 false 可保留手动 /compact 和“上下文”弹出框操作，但不启用上述任何行为。默认为 true。
compaction.threshold_percent:
  en: 'Auto-compaction fires when the estimated context usage reaches this percent of the effective model''s context window (1..100): its max_context_tokens, else the window its provider''s model listing reports, else 128000 - the window the web UI context ring shows.'
  zh: 当估计的上下文用量达到有效模型上下文窗口的这一百分比（1..100）时触发自动压缩：即其 max_context_tokens，否则为其提供商的模型列表所报告的窗口，否则为 128000 - 也就是 Web 界面上下文圆环所显示的窗口。
compaction.keep_recent_turns:
  en: 'How many most recent user turns (each with the agent replies and tool activity after it) stay verbatim; only history before that boundary is summarized. 0 summarizes the whole window. When the window holds no more user turns than this, a compaction keeps fewer: the automatic trigger down to the prompt being answered, the manual command down to none.'
  zh: 保留多少最近的用户轮次（每轮包含其后的智能体回复和工具活动）逐字不变；只有该边界之前的历史会被总结。0 表示总结整个窗口。当窗口中的用户轮次不多于此值时，压缩保留得更少：自动触发保留到正在回答的提示词为止，手动命令保留到零。
compaction.keep_tail_tokens:
  en: "Absolute ceiling on the tail a compaction keeps verbatim, in estimated tokens: the newest turns that fit it stay, never more than keep_recent_turns and never fewer than one (none for a manual compaction that folds everything). It bounds what a wide window leaves behind, which the steps after the fold would otherwise pay for again. 0 turns the cap off, so keep_recent_turns alone decides."
  zh: "压缩逐字保留的尾部在估算 token 上的绝对上限：能容得下的最新轮次会保留，最多 keep_recent_turns 个，至少一个（手动压缩折叠全部内容时为零个）。它限制宽窗口留下的尾部，否则折叠之后的每个步骤都要再次为它付费。0 表示关闭该上限，只由 keep_recent_turns 决定。"
compaction.model:
  en: Optional models[].model used for the summarization call. Empty uses the session's effective model.
  zh: 可选，用于总结调用的 models[].model。为空则使用会话的有效模型。
compaction.fallback_models:
  en: Summarizer models tried in order when the one before them fails (models[].model ids). The session's own model is the last resort whether or not it is listed, so a compaction is not blocked by one unreachable summarizer.
  zh: 当前一个失败时按顺序尝试的总结器模型（models[].model id）。无论是否列出，会话自身的模型都是最后手段，因此压缩不会因某个不可达的总结器而被阻塞。
compaction.result_eviction:
  en: Collapses superseded tool results to short placeholders when building the LLM request (the persisted transcript is never rewritten), so paging a large file, a wide search or a fan-out of directory listings cannot pin dead lines in every later turn. Read and grep results survive while the model marks them (keep_result, or keep:true) or they are among the most recent; the listings of glob, print_tree, websearch and webfetch survive within the latest three steps that hold one (a step is one assistant message with every result of its tool calls). A write invalidates earlier reads, greps and file listings that covered what it changed.
  zh: 在构建 LLM 请求时把已被取代的工具结果折叠为简短占位符（持久化的对话记录从不重写），使分页读取大文件、大范围搜索或目录列表的扇出无法在后续每个轮次中钉住失效的行。read 和 grep 结果在模型标记它们（keep_result，或 keep:true）或它们属于最近的结果时保留；glob、print_tree、websearch 和 webfetch 的列表在包含其一的最新三个步骤内保留（一个步骤是一条助手消息及其所有工具调用的全部结果）。一次写入会使其更改所覆盖的较早读取、grep 和文件列表失效。
compaction.result_eviction.enable:
  en: Master switch for tool result eviction (read, grep and the listing tools). Defaults to true.
  zh: 工具结果驱逐的总开关（read、grep 及列表工具）。默认为 true。
compaction.result_eviction.keep_recent:
  en: How many most recent evictable read and grep results (read pages, grep dumps) stay intact as a working window. 0 keeps none. Listing results do not count toward it. The default of 2 keeps a read and a grep live at the same time; with 1, a model comparing two results keeps re-fetching whichever the other evicted.
  zh: 多少最近的、可驱逐的 read 和 grep 结果（读取分页、grep 转储）保持完整作为工作窗口。0 表示不保留。列表结果不计入其中。默认值 2 使一个 read 和一个 grep 同时保持有效；设为 1 时，比较两个结果的模型会不断重新获取被另一个驱逐的那个。
compaction.result_eviction.min_result_bytes:
  en: Results at or below this size are never evicted (too small to be worth a placeholder). 0 makes every result a candidate.
  zh: 小于或等于此大小的结果永远不会被逐出（太小，不值得使用占位符）。0 会使每个结果都成为候选对象。
compaction.result_eviction.start_percent:
  en: Evict only once the estimated context reaches this percent of the model's context window. Below it the replayed history is sent untouched, so the provider's prompt cache keeps it; a placeholder appearing mid-history invalidates every cached token behind it. 0 evicts from the first result. Read and grep results of a model without max_context_tokens are evicted from the first result; listing results measure against the window its provider reports, or the default 128000.
  zh: 仅当估算上下文达到模型上下文窗口的该百分比时才开始逐出。低于该值时，重放的历史记录会原样发送，因此提供商的提示词缓存会保留它；占位符出现在历史记录中间会使其后每个缓存 token 失效。0 表示从第一个结果开始逐出。没有 max_context_tokens 的模型的读取和 grep 结果会从第一个结果开始逐出；列表结果则按其提供商报告的窗口或默认 128000 来衡量。
compaction.result_eviction.start_tokens:
  en: "Absolute ceiling on the eviction gate: eviction starts at the smaller of start_percent of the window and this many conversation tokens. The conversation is measured without the request's own overhead (the system prompt, the tool definitions, the rules), which nothing can evict, so a large AGENTS.md cannot open the gate at the first result. 0 leaves start_percent alone."
  zh: "逐出门槛的绝对上限：逐出在窗口的 start_percent 与这么多对话 token 中较小者处开始。对话的测量不计请求自身的开销（系统提示词、工具定义、规则），这些都无法逐出，因此很大的 AGENTS.md 不会在第一个结果处就打开门槛。0 表示只保留 start_percent。"
memory:
  en: Optional memory subagent (implementation in external/memory; enable at runtime with memory.enable).
  zh: 可选的记忆子智能体（实现位于 external/memory；运行时通过 memory.enable 启用）。
decisions:
  en: 'Ask the NeuralDeep decisions API whether a shell command is safe before the permission gate decides: a safe command runs without a prompt, an unsafe one is asked about in every mode, bypass included, and rejected where nobody can answer. See https://coddy.dev/docs/features/decisions.'
  zh: 在权限门控做出决定之前，询问 NeuralDeep decisions API 某条 shell 命令是否安全：安全的命令无需询问即可运行；不安全的命令在每种模式下都会询问，包括 bypass 模式；在无人能应答的情况下则拒绝。参见 https://coddy.dev/docs/features/decisions。
decisions.enable:
  en: 'Check run_command and ssh_run_command calls the operator did not allow explicitly against the decisions endpoint before the permission gate decides. A safe command runs without a prompt; an unsafe one, or one the check gave no verdict on, is asked about in every mode, bypass included, with the verdict in a prompt no mode or surface answers by itself, and where nobody can answer it is rejected, the rejection returned as the tool result so the session records it. Commands the allowlist, a session grant of exactly that command or a hook''s allow approves are not checked, and neither are commands the operator approved in a prompt; a program-wide or prefix grant does not exempt a command from the check. Needs a NeuralDeep credential on the first provider row of type neuraldeep: its api_key or api_key_command, its NAME_API_KEY environment variable (NEURALDEEP_API_KEY for a row named neuraldeep or when there is no row) or its stored hub sign-in.'
  zh: 在权限门控做出决定之前，将操作者未显式允许的 run_command 和 ssh_run_command 调用与 decisions 端点进行核对。安全命令无需询问即可运行；不安全的命令，或检查未给出裁决的命令，在每种模式下都会询问，包括 bypass 模式，裁决会放在提示中，任何模式或界面都不会自行应答该提示，无人能应答时则拒绝，拒绝结果作为工具结果返回，以便会话记录。由允许列表、对恰好该命令的会话授权或钩子的 allow 批准的命令不进行检查，操作者在提示中批准的命令也不检查；程序范围或前缀授权不会使命令免于检查。需要在类型为 neuraldeep 的第一个提供商行上提供 NeuralDeep 凭据：其 api_key 或 api_key_command、其 NAME_API_KEY 环境变量（对于名为 neuraldeep 的行或没有行时，为 NEURALDEEP_API_KEY），或其存储的 hub 登录信息。
decisions.model:
  en: 'Decisions model to ask: frida-decisions (encoder pass, up to 512 tokens of command text, ~20 ms per request) or clef-flash (up to 8192 tokens, ~150 ms).'
  zh: 要询问的 decisions 模型：frida-decisions（编码器前向，最多 512 个 token 的命令文本，每次请求约 20 ms）或 clef-flash（最多 8192 个 token，约 150 ms）。
decisions.threshold:
  en: Probability of the unsafe option at or above which a command counts as unsafe. 0 uses the default (0.5); lower is stricter, higher lets borderline commands through. A bare unsafe answer counts as 1.
  zh: 不安全选项的概率达到或超过该值时，命令被视为不安全。0 使用默认值（0.5）；较低值更严格，较高值会让边缘命令通过。仅返回 unsafe 的答案按 1 计算。
memory.enable:
  en: Expose the bundled memory subagent to the model through spawn_agent (needs the memory build tag).
  zh: 通过 spawn_agent 向模型暴露内置的记忆子智能体（需要 memory 构建标签）。
memory.model:
  en: Exact models[].model id the memory subagent runs on; empty uses the session's model.
  zh: 记忆子智能体运行所用的确切 models[].model id；为空则使用会话的模型。
memory.fallback_models:
  en: Memory subagent models tried in order when the one before them fails before answering (models[].model ids). The session's own model is the last resort whether or not it is listed, so one unreachable deployment does not take the memory run down with it.
  zh: 当排在前面的模型在应答前失败时，按顺序尝试的记忆子智能体模型（models[].model id）。会话自身的模型始终作为最后手段，无论是否列出，因此一个无法访问的部署不会拖垮记忆运行。
memory.dir:
  en: Long-term memory root. Empty resolves to ${CODDY_HOME}/memory. Supports ${CODDY_HOME} and ~.
  zh: 长期记忆根目录。为空时解析为 ${CODDY_HOME}/memory。支持 ${CODDY_HOME} 和 ~。
memory.recall_max_turns:
  en: Bounds the memory subagent's ReAct rounds together with persist_max_turns; the child's cap is the larger of the two.
  zh: 与 persist_max_turns 一起限制记忆子智能体的 ReAct 轮数；子智能体的上限取两者中较大的值。
memory.persist_max_turns:
  en: Bounds the memory subagent's ReAct rounds together with recall_max_turns; the child's cap is the larger of the two.
  zh: 与 recall_max_turns 一起限制记忆子智能体的 ReAct 轮数；子智能体的上限取两者中较大的值。
memory.copilot_max_tokens:
  en: Completion token cap for the memory model's calls.
  zh: 记忆模型调用的补全 token 上限。
memory.max_search_hits:
  en: Maximum snippets returned by memory_search.
  zh: memory_search 返回的最大片段数。
memory.max_note_chars:
  en: Longest body one note saved by coddy_memory_save may have, in characters (not bytes). An explicit 0 removes the cap.
  zh: coddy_memory_save 保存的单条笔记正文的最大长度，以字符（而非字节）计。显式设置为 0 会移除上限。
memory.additional_prompt:
  en: 'Operator instructions for the memory subagent alone: a section of its system prompt that the main agent never sees. Empty adds nothing.'
  zh: 仅给记忆子智能体的操作者指令：其系统提示词中的一个章节，主智能体永远不会看到。为空则不添加任何内容。
memory.additional_prompt_max_chars:
  en: Cap on additional_prompt in characters; a longer text is cut there, the agent log says so and coddy -t reports it. 0 means no cap.
  zh: additional_prompt 的字符数上限；更长的文本会在该处截断，智能体日志会说明，coddy -t 会报告。0 表示无上限。
httpserver:
  en: OpenAI-compatible HTTP API defaults (used only by binaries built with -tags http; the embedded SPA needs -tags http,ui). See https://coddy.dev/docs/reference/http-api.
  zh: OpenAI 兼容 HTTP API 的默认值（仅由使用 -tags http 构建的二进制使用；嵌入式 SPA 需要 -tags http,ui）。参见 https://coddy.dev/docs/reference/http-api。
httpserver.enable:
  en: Serve the HTTP API (and the embedded SPA) in this process. Omitted means true; set false on a node that only polls a messenger or relays a swarm.
  zh: 在此进程中提供 HTTP API（以及嵌入式 SPA）。省略表示 true；在仅轮询 messenger 或为集群提供中继的节点上设置为 false。
httpserver.host:
  en: Bind address for the HTTP API. Empty means 127.0.0.1; set 0.0.0.0 to accept connections from other machines.
  zh: HTTP API 的绑定地址。为空表示 127.0.0.1；设置为 0.0.0.0 以接受来自其他机器的连接。
httpserver.port:
  en: Default listen port when coddy serve does not pass -P/--port. 0 falls back to 12345.
  zh: 当 coddy serve 未传递 -P/--port 时使用的默认监听端口。0 回退到 12345。
httpserver.max_body_bytes:
  en: Largest request body accepted by POST /v1/chat/completions and POST /v1/responses, in bytes. 0 means the built-in 512 MiB. A larger body is refused with 413 and the request_too_large error.
  zh: POST /v1/chat/completions 和 POST /v1/responses 接受的最大请求体，以字节计。0 表示内置的 512 MiB。更大的请求体将以 413 和 request_too_large 错误拒绝。
httpserver.max_client_tools:
  en: Most tools a client may offer a direct model on POST /v1/chat/completions and POST /v1/responses. 0 means the built-in 128, OpenAI's own limit. More are refused with 400 and the too_many_tools error, which names the count and this setting. Raise it for a client whose MCP servers offer more; a provider with a limit of its own still applies it.
  zh: 客户端在 POST /v1/chat/completions 和 POST /v1/responses 上向直接模型提供的最多工具数。0 表示内置的 128，即 OpenAI 自身的限制。更多工具会以 400 和 too_many_tools 错误拒绝，该错误会指明数量和此设置。对于其 MCP 服务器提供更多工具的客户端，可提高此值；提供商自身的限制仍会生效。
httpserver.max_client_tool_schema_bytes:
  en: Largest parameters schema of one client tool on POST /v1/chat/completions and POST /v1/responses, in bytes. 0 means the built-in 256 KiB. A larger one is refused with 400 and the tool_parameters_too_large error.
  zh: 在 POST /v1/chat/completions 和 POST /v1/responses 上，单个客户端工具的参数 schema 最大大小，以字节计。0 表示内置的 256 KiB。更大的会以 400 和 tool_parameters_too_large 错误拒绝。
httpserver.auth_token:
  en: Optional bearer credential for the HTTP API. Empty means no authentication (historical default). Use a "${ENV}" reference to keep the secret out of the file; never echoed back by GET /coddy/config. Prefer --auth-token / CODDY_HTTP_TOKEN to keep it out of config.yaml entirely. See https://coddy.dev/docs/operate/remote.
  zh: HTTP API 的可选 bearer 凭据。为空表示不进行身份验证（历史默认值）。使用 "${ENV}" 引用可将密钥排除在文件之外；GET /coddy/config 永远不会回显它。优先使用 --auth-token / CODDY_HTTP_TOKEN，以将其完全排除在 config.yaml 之外。参见 https://coddy.dev/docs/operate/remote。
httpserver.login:
  en: Optional password sign-in for the browser, so a server on a network is not readable by everyone who finds the port. Off unless an account exists here or in CODDY_HTTP_USER / CODDY_HTTP_PASSWORD. API clients keep using auth_token. See https://coddy.dev/docs/operate/remote.
  zh: 可选的浏览器密码登录，使网络上的服务器不会被任何发现该端口的人读取。除非此处或 CODDY_HTTP_USER / CODDY_HTTP_PASSWORD 中存在账户，否则关闭。API 客户端继续使用 auth_token。参见 https://coddy.dev/docs/operate/remote。
httpserver.login.enable:
  en: 'Turn the sign-in form on or off explicitly. Omitted follows the credentials: an account here or in the environment enables it. false keeps the form off with the variables still set.'
  zh: 显式开启或关闭登录表单。省略时跟随凭据：此处或环境中的账户会启用它。设置为 false 时，即使变量仍存在，也会保持表单关闭。
httpserver.login.mode:
  en: How a browser authenticates. Only "password" is implemented; the key exists so a trusted-proxy mode can be added without moving your configuration.
  zh: 浏览器进行身份验证的方式。仅实现了 "password"；保留该键是为了在不移动配置的情况下添加受信任代理模式。
httpserver.login.user:
  en: Account name for the sign-in form. Supports "${ENV}" references, e.g. "${CODDY_HTTP_USER}".
  zh: 登录表单的账户名。支持 "${ENV}" 引用，例如 "${CODDY_HTTP_USER}"。
httpserver.login.password_hash:
  en: argon2id hash of the password in PHC form ("$argon2id$v=19$m=...$..."), written by `coddy serve set-password`. Never echoed back by GET /coddy/config, and a save from the settings screen preserves it. Put a plaintext password in CODDY_HTTP_PASSWORD instead of here.
  zh: 密码的 argon2id 哈希，采用 PHC 形式（"$argon2id$v=19$m=...$..."），由 `coddy serve set-password` 写入。GET /coddy/config 永远不会回显它，从设置屏幕保存时会保留它。请将明文密码放在 CODDY_HTTP_PASSWORD 中，而不是这里。
httpserver.login.session_ttl_hours:
  en: How long a browser stays signed in. 0 means the cookie is dropped when the browser closes; the server still expires the session itself after 30 days, because a record it keeps forever is not a session.
  zh: 浏览器保持登录的时长。0 表示浏览器关闭时丢弃 cookie；服务器仍会在 30 天后自行使会话过期，因为永久保留的记录不是会话。
httpserver.public_docs:
  en: When auth is enabled, keep /docs and /openapi.* reachable without a token.
  zh: 启用身份验证时，保持 /docs 和 /openapi.* 无需 token 即可访问。
httpserver.allow_insecure:
  en: 'Say that a server without authentication is open on purpose: silences the two startup warnings about it - a non-loopback bind, and CORS that admits pages nobody listed (allow_loopback or "*") - and the --dry-run findings that mirror them, and turns off the refusal of a foreign Host on loopback and of a cross-origin write.'
  zh: 表明无身份验证的服务器是有意开放的：消除关于它的两条启动警告 - 非环回绑定，以及允许未列出的页面的 CORS（allow_loopback 或 "*"） - 以及镜像这些警告的 --dry-run 发现，并关闭对环回上外来 Host 和跨源写入的拒绝。
httpserver.cors:
  en: 'Cross-origin access so a browser UI on another origin can call this API (e.g. the bundled UI pointed at a remote server). Bearer auth still applies: CORS decides whether a browser shows a page the answer, never whether the server gives one.'
  zh: 跨源访问，使另一个源上的浏览器 UI 可以调用此 API（例如将内置 UI 指向远程服务器）。Bearer 身份验证仍然适用：CORS 决定浏览器是否把响应展示给页面，而从不决定服务器是否给出响应。
httpserver.cors.enable:
  en: Handle CORS preflight and emit Access-Control-* headers for allowed origins.
  zh: 处理 CORS 预检，并为允许的源发出 Access-Control-* 头。
httpserver.cors.allow_loopback:
  en: 'Also allow any page served from the browser''s own machine: an http or https origin whose host is localhost, a *.localhost name, 127.0.0.0/8 or [::1], on any port. The laptop case of a remote coddy serve, where the web UI comes from the laptop''s own coddy serve and its port moves. Narrower than "*", and like "*" only as safe as the token or sign-in behind the API.'
  zh: 还允许从浏览器自身机器提供的任何页面：主机为 localhost、*.localhost 名称、127.0.0.0/8 或 [::1] 的 http 或 https 源，任意端口。这是远程 coddy serve 的笔记本电脑场景，其中 Web 界面来自笔记本电脑自身的 coddy serve，且其端口会变化。比 "*" 更窄，并且和 "*" 一样，其安全性仅取决于 API 背后的 token 或登录。
httpserver.cors.allowed_origins:
  en: Exact origins permitted to call the API, e.g. "http://localhost:5173". A single "*" allows any origin.
  zh: 允许调用 API 的确切源，例如 "http://localhost:5173". 单个 "*" 允许任何源。
httpserver.remotes:
  en: Remote coddy serve servers and swarm relays offered in the UI environment selector and resolved by `coddy --remote <name>`. An entry may carry the token to present; without one the UI keeps the token in the browser per remote and the console reads --remote-token or CODDY_REMOTE_TOKEN.
  zh: 在 UI 环境选择器中提供、并由 `coddy --remote <name>` 解析的远程 coddy serve 服务器和集群中继。条目可以携带要出示的 token；如果没有，UI 会按远程在浏览器中保存 token，控制台会读取 --remote-token 或 CODDY_REMOTE_TOKEN。
httpserver.remotes[].name:
  en: 'Display label for the remote. Empty: the web UI shows the name the remote reports (a relay''s swarm.name, else the host name it runs on; an agent''s host name), else its address.'
  zh: 远程的显示标签。为空时：Web 界面显示远程报告的名称（中继的 swarm.name，否则为其运行所在的主机名；智能体的主机名），否则显示其地址。
httpserver.remotes[].url:
  en: Base URL of the remote coddy serve server or relay, e.g. "https://box.example:12345".
  zh: 远程 coddy serve 服务器或中继的基础 URL，例如 "https://box.example:12345".
httpserver.remotes[].token:
  en: 'Bearer token to present to this remote: a relay''s client token (swarm.auth_token) or a server''s httpserver.auth_token, usually a ${ENV} reference. Optional and opt-in: every browser that reads this configuration receives it, and coddy --remote <name> uses it when --remote-token is not given. A node mounted under a relay (<url>/swarm/nodes/<name>) takes the relay''s token.'
  zh: 向此远程出示的 bearer token：中继的客户端 token（swarm.auth_token）或服务器的 httpserver.auth_token，通常是 ${ENV} 引用。可选且需主动启用：每个读取此配置的浏览器都会收到它，并且当未提供 --remote-token 时，coddy --remote <name> 会使用它。挂载在中继下的节点（<url>/swarm/nodes/<name>）采用中继的 token。
swarm:
  en: Stateless relay that nodes register into and that chains into other relays. The relay itself needs -tags swarm and swarm.enable; the join list below is honoured by any coddy serve process, which is what makes an ordinary agent reachable through a relay. See https://coddy.dev/docs/operate/swarm.
  zh: 无状态中继，节点注册到其中，并可链接到其他中继。中继本身需要 -tags swarm 和 swarm.enable；下面的加入列表由任何 coddy serve 进程遵循，这正是普通智能体可通过中继访问的原因。参见 https://coddy.dev/docs/operate/swarm。
swarm.enable:
  en: Run the swarm relay in this process. Independent of swarm.join, which is how an agent registers into a parent relay.
  zh: 在此进程中运行集群中继。与 swarm.join 无关，后者是智能体注册到父中继的方式。
swarm.host:
  en: Bind address for the relay when the CLI does not pass --swarm-host. Empty falls back to 0.0.0.0.
  zh: 当 CLI 未传递 --swarm-host 时中继的绑定地址。为空回退到 0.0.0.0。
swarm.port:
  en: Listen port for the relay. 0 falls back to 12346.
  zh: 中继的监听端口。0 回退到 12346。
swarm.name:
  en: 'Label for this relay in topology views, in /swarm/info and in a child''s node path. Empty: the host name it runs on.'
  zh: 此中继在拓扑视图、/swarm/info 和子节点路径中的标签。为空：其运行所在的主机名。
swarm.auth_token:
  en: Bearer credential clients present to this relay. A relay reaches every node with that node's own credential, so an unauthenticated relay bound off loopback is a fleet-wide open door and the server refuses to start unless allow_insecure is set. Never echoed back.
  zh: 客户端向此中继出示的 bearer 凭据。中继使用每个节点自己的凭据访问该节点，因此绑定在非环回地址且未认证的中继是整个集群的敞开大门；除非设置了 allow_insecure，否则服务器拒绝启动。永不回显。
swarm.pairing_tokens:
  en: Credentials a node must present to register. Empty closes registration unless insecure_open_registration is set. Never echoed back.
  zh: 节点注册时必须出示的凭据。为空会关闭注册，除非设置了 insecure_open_registration。永不回显。
swarm.allow_insecure:
  en: Permit binding off loopback without a client token.
  zh: 允许在没有客户端 token 的情况下绑定到非环回地址。
swarm.insecure_open_registration:
  en: Let any caller register a node without a pairing token. Development only.
  zh: 允许任何调用方在没有配对 token 的情况下注册节点。仅用于开发。
swarm.allow_private_upstreams:
  en: Hosts a node may advertise even though they resolve into loopback or private ranges, which are otherwise refused so a registration cannot turn the relay into a probe of its own network.
  zh: 节点可以通告的主机，即使它们解析到环回或私有地址范围；否则这些会被拒绝，以免注册把中继变成对其自身网络的探测。
swarm.cors:
  en: Cross-origin access for the relay API. The SPA reaches a relay from another origin by construction, so this usually has to be on. Allow-Headers includes Last-Event-ID so an SSE stream can be resumed through the relay.
  zh: 中继 API 的跨源访问。SPA 从构造上就是从另一个源访问中继，因此通常必须开启。Allow-Headers 包含 Last-Event-ID，以便 SSE 流可通过中继恢复。
swarm.cors.enable:
  en: Handle CORS preflight and emit Access-Control-* headers for allowed origins.
  zh: 处理 CORS 预检，并为允许的源发出 Access-Control-* 头。
swarm.cors.allow_loopback:
  en: 'Also allow any page served from the browser''s own machine: an http or https origin whose host is localhost, a *.localhost name, 127.0.0.0/8 or [::1], on any port. A laptop''s web UI reaching this relay, whatever port its own coddy serve took. Narrower than "*"; the client token still applies.'
  zh: 还允许从浏览器自身机器提供的任何页面：主机为 localhost、*.localhost 名称、127.0.0.0/8 或 [::1] 的 http 或 https 源，任意端口。笔记本电脑的 Web 界面访问此中继，无论其自身的 coddy serve 占用了哪个端口。比 "*" 更窄；客户端 token 仍然适用。
swarm.cors.allowed_origins:
  en: Exact origins permitted to call the API, e.g. "http://localhost:5173". A single "*" allows any origin.
  zh: 允许调用 API 的确切源，例如 "http://localhost:5173". 单个 "*" 允许任何源。
swarm.tls:
  en: Serve the relay over HTTPS. Set both files or neither. Minimum TLS 1.2; certificates are startup state, so rotating them needs a restart.
  zh: 通过 HTTPS 提供中继。两个文件要么都设置，要么都不设置。最低 TLS 1.2；证书是启动时状态，因此轮换证书需要重启。
swarm.tls.cert_file:
  en: PEM certificate chain.
  zh: PEM 证书链。
swarm.tls.key_file:
  en: PEM private key.
  zh: PEM 私钥。
swarm.lease_ttl_seconds:
  en: How long a registration survives without a heartbeat. 0 falls back to 90; nodes refresh at a third of it.
  zh: 注册在没有心跳的情况下存活的时长。0 回退到 90；节点按其三分之一进行刷新。
swarm.fanout_timeout_seconds:
  en: Per-node deadline for an aggregated call. A slower node degrades into a warning rather than stalling the answer. 0 falls back to 3.
  zh: 聚合调用的每节点截止时间。较慢的节点会降级为警告，而不会阻塞应答。0 回退到 3。
swarm.upstreams:
  en: Nodes configured by hand rather than registered, for an agent that cannot run the join loop.
  zh: 手动配置而非注册的节点，用于无法运行加入循环的智能体。
swarm.upstreams[].name:
  en: Node name; becomes a URL path segment, so letters, digits, underscore and hyphen only.
  zh: 节点名称；会成为 URL 路径段，因此只能包含字母、数字、下划线和连字符。
swarm.upstreams[].url:
  en: Origin the relay dials to reach the node.
  zh: 中继为访问该节点而拨号的源。
swarm.upstreams[].kind:
  en: agent (default) or relay.
  zh: agent（默认）或 relay。
swarm.upstreams[].token:
  en: Bearer credential the relay presents to this node. Never echoed back.
  zh: 中继向此节点出示的 bearer 凭据。永不回显。
swarm.upstreams[].dial:
  en: How this leg reaches the other side. Relays are expected to live in different networks, so a proxy hop and a private certificate authority are ordinary here.
  zh: 此链路如何到达另一端。中继预期位于不同网络，因此代理跳转和私有证书颁发机构在这里很常见。
swarm.upstreams[].dial.proxy:
  en: 'Route the connection through a proxy: http, https, socks5 or socks5h. Empty falls back to the standard environment variables. Never echoed back.'
  zh: 通过代理路由连接：http、https、socks5 或 socks5h。为空回退到标准环境变量。永不回显。
swarm.upstreams[].dial.ca_file:
  en: Certificate authority used to verify a peer whose certificate is signed privately.
  zh: 用于验证证书为私下签名的对端的证书颁发机构。
swarm.upstreams[].dial.insecure_skip_verify:
  en: Accept any certificate. For a lab only; every use is logged.
  zh: 接受任何证书。仅用于实验环境；每次使用都会记录日志。
swarm.join:
  en: Parent relays this process registers into on startup. Honoured whether or not this process runs a relay of its own, which is what lets relays chain.
  zh: 此进程在启动时注册到的父中继。无论此进程是否运行自己的中继都会遵循，这正是中继可以链式连接的原因。
swarm.join[].url:
  en: Parent relay origin.
  zh: 父中继源。
swarm.join[].name:
  en: Name to claim in that relay. Empty falls back to the host name.
  zh: 要在该中继中声明的名称。为空回退到主机名。
swarm.join[].pairing_token:
  en: Credential authorising the registration. Never echoed back.
  zh: 授权注册的凭据。永不回显。
swarm.join[].advertise_url:
  en: 'Where the relay can reach this process. Leave empty to select the tunnel transport: this process dials out and serves its API back over that connection, which is the only way in when the network accepts no inbound connections.'
  zh: 中继可以访问此进程的位置。留空以选择隧道传输：此进程向外拨号，并通过该连接反向提供其 API，当网络不接受入站连接时，这是唯一的进入方式。
swarm.join[].token:
  en: This process's own bearer credential, handed to the relay so it can authenticate when it proxies. Prefer a credential minted for the relay alone. Never echoed back.
  zh: 此进程自身的 bearer 凭据，交给中继，以便其代理时进行身份验证。优先使用专为中继签发的凭据。永不回显。
swarm.join[].labels:
  en: Free-form tags shown in topology views.
  zh: 在拓扑视图中显示的自由形式标签。
swarm.join[].dial:
  en: How this leg reaches the other side. Relays are expected to live in different networks, so a proxy hop and a private certificate authority are ordinary here.
  zh: 此链路如何到达另一端。中继预期位于不同网络，因此代理跳转和私有证书颁发机构在这里很常见。
swarm.join[].dial.proxy:
  en: 'Route the connection through a proxy: http, https, socks5 or socks5h. Empty falls back to the standard environment variables. Never echoed back.'
  zh: 通过代理路由连接：http、https、socks5 或 socks5h。为空回退到标准环境变量。永不回显。
swarm.join[].dial.ca_file:
  en: Certificate authority used to verify a peer whose certificate is signed privately.
  zh: 用于验证证书为私下签名的对端的证书颁发机构。
swarm.join[].dial.insecure_skip_verify:
  en: Accept any certificate. For a lab only; every use is logged.
  zh: 接受任意证书。仅限实验环境；每次使用都会记录日志。
metrics:
  en: 'Prometheus exporter: GET /metrics on a port of its own, run by coddy serve. It takes effect only in a binary built with -tags metrics; other binaries refuse metrics.enable. Off by default.'
  zh: Prometheus 导出器：在独立端口上提供 GET /metrics，由 coddy serve 运行。仅在以 -tags metrics 构建的二进制中生效；其他二进制会拒绝 metrics.enable。默认关闭。
metrics.enable:
  en: Run the exporter in this process. Needs the metrics build tag.
  zh: 在此进程中运行导出器。需要 metrics 构建标签。
metrics.host:
  en: Bind address of the exporter. Empty falls back to 127.0.0.1, which only this machine can reach.
  zh: 导出器的绑定地址。留空则回退到 127.0.0.1，仅本机可访问。
metrics.port:
  en: Listen port of the exporter. 0 falls back to 12347.
  zh: 导出器的监听端口。0 会回退到 12347。
metrics.token:
  en: Bearer credential a scrape must present in its Authorization header. ${ENV} references are expanded at load. Empty means no authentication, so set one before binding off loopback. Never echoed back.
  zh: 抓取时必须在 Authorization 请求头中提供的 Bearer 凭据。${ENV} 引用会在加载时展开。留空表示不进行身份验证，因此在绑定到非回环地址前应设置一个。绝不会回显。
ui:
  en: Controls the bundled single-page UI (only meaningful in binaries built with -tags http,ui).
  zh: 控制内置的单页 UI（仅在以 -tags http,ui 构建的二进制中有意义）。
ui.enable:
  en: Serve the embedded SPA at GET /. Defaults to true; set false to run an API-only server (the API still requires httpserver.auth_token when configured).
  zh: 在 GET / 提供内嵌 SPA。默认值为 true；设为 false 可运行仅 API 的服务器（配置后 API 仍需要 httpserver.auth_token）。
scheduler:
  en: Cron-driven scheduled jobs (used only by binaries built with -tags scheduler). Jobs are flat *.md files with YAML frontmatter in ${CODDY_HOME}/scheduler (user jobs) and <workspace>/.coddy/scheduler (project jobs, which run once approved); five-field crontab in UTC. A run is a background agent task under the job's own session, which is the job's run history.
  zh: Cron 驱动的定时任务（仅在以 -tags scheduler 构建的二进制中使用）。任务是位于 ${CODDY_HOME}/scheduler（用户任务）和 <workspace>/.coddy/scheduler（项目任务，批准后才会运行）中的平铺 *.md 文件，带 YAML frontmatter；使用 UTC 的五字段 crontab。一次运行是该任务自身会话下的一个后台智能体任务，而这个会话就是该任务的运行历史。
scheduler.enable:
  en: Run the scheduler daemon and expose the coddy_scheduler_* tools. Can also be forced per process with coddy serve --scheduler (or coddy acp -scheduler).
  zh: 运行调度器守护进程并暴露 coddy_scheduler_* 工具。也可通过 coddy serve --scheduler（或 coddy acp -scheduler）按进程强制启用。
scheduler.max_queue:
  en: Runs in flight across all jobs at once; a due slot past the cap is skipped until a run finishes, and a manual run past it is refused.
  zh: 所有任务同时正在进行的运行数；超过上限的到期时槽会被跳过，直到有运行完成，而超过上限的手动运行会被拒绝。
scheduler.timeout:
  en: Wall-clock limit for one run, as a Go duration (e.g. "30m", "1h30m"); the background task pool still caps it at tools.background.max_timeout_seconds.
  zh: 单次运行的实际时间限制，使用 Go 时长表示（例如 "30m"、"1h30m"）；后台任务池仍会以 tools.background.max_timeout_seconds 为其设上限。
scheduler.project_trust:
  en: 'Trust policy for project jobs, the *.md files in <workspace>/.coddy/scheduler that travel with the checkout: "ask" lists them but runs one only once the operator approved that exact file for that workspace (the shield in the scheduler drawer, or POST /coddy/scheduler/jobs/{job_id}/trust?scope=project from a session in it); a job the operator creates through Coddy is approved at once; "allow" runs them like the operator''s own jobs; "deny" never runs them. See https://coddy.dev/docs/operate/scheduler#project-jobs-and-trust.'
  zh: 项目任务的信任策略；项目任务指随检出一起携带的 <workspace>/.coddy/scheduler 中的 *.md 文件："ask" 会列出它们，但只有在操作员为该项目工作区批准了该确切文件后才会运行（调度器抽屉中的盾牌，或从该工作区中的会话发送 POST /coddy/scheduler/jobs/{job_id}/trust?scope=project）；操作员通过 Coddy 创建的任务会立即获得批准；"allow" 会像操作员自己的任务一样运行它们；"deny" 则永不运行它们。参见 https://coddy.dev/docs/operate/scheduler#project-jobs-and-trust。
scheduler.retain_sessions:
  en: Finished runs kept per job_id (their task records and transcripts under the job session); older runs are removed when a run finishes.
  zh: 每个 job_id 保留的已完成运行（其任务记录和对话记录位于任务会话下）；当有运行完成时，较旧的运行会被移除。
gateways:
  en: Messenger bot adapters (used only by binaries built with -tags gateway, or -tags gateway.telegram / gateway.pachca for one adapter; started by coddy serve alongside every other enabled subsystem). See https://coddy.dev/docs/surfaces/gateway and https://coddy.dev/docs/surfaces/pachca.
  zh: 即时通讯机器人适配器（仅在以 -tags gateway 构建的二进制中使用，或以 -tags gateway.telegram / gateway.pachca 构建以使用单个适配器；由 coddy serve 与所有其他已启用的子系统一起启动）。参见 https://coddy.dev/docs/surfaces/gateway 和 https://coddy.dev/docs/surfaces/pachca。
gateways.telegram:
  en: Telegram bot adapter.
  zh: Telegram 机器人适配器。
gateways.telegram.enable:
  en: Poll Telegram in this coddy serve process.
  zh: 在此 coddy serve 进程中轮询 Telegram。
gateways.telegram.token:
  en: Bot token from @BotFather. Leave empty to read the TELEGRAM_BOT_TOKEN environment variable (e.g. via ~/.coddy/.env).
  zh: 来自 @BotFather 的机器人令牌。留空则读取 TELEGRAM_BOT_TOKEN 环境变量（例如通过 ~/.coddy/.env）。
gateways.telegram.proxy:
  en: 'inherit (the default, the same as leaving the key out), none, or a proxy URL: http://, https://, socks5:// or socks5h://, read like providers[].proxy. inherit follows the proxy the environment of the Coddy process names - HTTPS_PROXY, HTTP_PROXY and NO_PROXY, never for a loopback address; ALL_PROXY is not read. none connects the bot directly and ignores those variables. A proxy URL sends every Bot API request through that proxy; with SOCKS the proxy resolves host names.'
  zh: inherit（默认值，等同于省略该键）、none 或代理 URL：http://, https://, socks5:// 或 socks5h://，读取方式与 providers[].proxy 相同。inherit 会遵循 Coddy 进程环境中的代理相关变量 HTTPS_PROXY、HTTP_PROXY 和 NO_PROXY；对回环地址绝不使用代理；不读取 ALL_PROXY。none 会直接连接机器人并忽略这些变量。代理 URL 会将每个 Bot API 请求都通过该代理发送；使用 SOCKS 时由代理解析主机名。
gateways.telegram.rich_messages:
  en: Use Bot API 10.1 Rich Messages (native Markdown, streamed thinking placeholder, collapsible tool list). Falls back to legacy formatting when unsupported.
  zh: 使用 Bot API 10.1 Rich Messages（原生 Markdown、流式传输的思考占位符、可折叠的工具列表）。不受支持时会回退到旧版格式。
gateways.telegram.admins:
  en: Telegram user IDs with elevated rights; admins always pass access checks.
  zh: 具有提升权限的 Telegram 用户 ID；管理员始终通过访问检查。
gateways.telegram.default_access:
  en: 'Fallback access level for chats without an override: "all", "admins", or "group:<name>".'
  zh: 未设置覆盖的聊天所使用的回退访问级别："all"、"admins" 或 "group:<name>"。
gateways.telegram.default_isolation:
  en: 'Fallback session isolation for group chats: "individual" (session per user), "shared" (one session for all), "admin" (admins only, shared session).'
  zh: 群聊的回退会话隔离方式："individual"（每个用户一个会话）、"shared"（所有用户共用一个会话）、"admin"（仅管理员，共用会话）。
gateways.telegram.user_groups:
  en: Named sets of user IDs referenced from access fields as group:<name>.
  zh: 具名用户 ID 集合，可在访问字段中以 group:<name> 引用。
gateways.telegram.user_groups[].name:
  en: Group name referenced as group:<name>.
  zh: 以 group:<name> 引用的组名。
gateways.telegram.user_groups[].user_ids:
  en: Telegram numeric user IDs in this group.
  zh: 此组中的 Telegram 数字用户 ID。
gateways.telegram.chats:
  en: Per-chat overrides; chat_id is negative for groups and supergroups.
  zh: 按聊天设置的覆盖项；群组和超级群的 chat_id 为负数。
gateways.telegram.chats[].chat_id:
  en: Telegram chat id (negative for groups/supergroups).
  zh: Telegram 聊天 ID（群组和超级群为负数）。
gateways.telegram.chats[].isolation:
  en: Per-chat session isolation override.
  zh: 按聊天设置的会话隔离覆盖项。
gateways.telegram.chats[].access:
  en: 'Per-chat access override: "all", "admins", or "group:<name>".'
  zh: 按聊天设置的访问覆盖项："all"、"admins" 或 "group:<name>"。
gateways.telegram.mini_app:
  en: Makes the web UI of this coddy serve the bot's Telegram Mini App. The web UI adapts to Telegram by itself; these keys tell the bot where it is, so it can set its menu button and answer /app with a button that opens the chat's own conversation. Telegram opens Mini Apps over https only, so the web UI has to be published behind a TLS proxy, with sign-in on (httpserver.login). See https://coddy.dev/docs/surfaces/gateway#mini-app.
  zh: 使此 coddy serve 的 Web 界面成为该机器人的 Telegram Mini App。Web 界面会自行适配 Telegram；这些键告诉机器人它所在的位置，以便它设置菜单按钮，并用一个按钮响应 /app，该按钮会打开该聊天自己的对话。Telegram 仅通过 https 打开 Mini App，因此 Web 界面必须发布在 TLS 代理之后，并开启登录（httpserver.login）。参见 https://coddy.dev/docs/surfaces/gateway#mini-app。
gateways.telegram.mini_app.url:
  en: 'The public https address the web UI is served at, for example https://coddy.example.com/. Plain http is accepted only for a loopback host (an offline stand such as tgfake). No fragment: Telegram puts its launch parameters there. Empty: the bot offers no Mini App and leaves a menu button set in @BotFather alone.'
  zh: Web 界面对外提供服务的公共 https 地址，例如 https://coddy.example.com/.。纯 http 仅接受回环主机（例如 tgfake 这样的离线测试台）。不能包含片段：Telegram 会把其启动参数放在那里。留空：机器人不提供 Mini App，并且不会改动在 @BotFather 中设置的菜单按钮。
gateways.telegram.mini_app.menu_button:
  en: Make the bot's menu button (beside the message field) open the web UI. Turned off, with url emptied or while the web UI asks for no sign-in, the bot puts back the menu button it replaced (a Mini App set in @BotFather, else the commands), as long as the button still opens the address the bot set.
  zh: 让机器人的菜单按钮（位于消息输入框旁）打开 Web 界面。关闭此项、清空 url，或 Web 界面不要求登录时，只要该按钮仍打开机器人设置的地址，机器人就会恢复它此前替换掉的菜单按钮（在 @BotFather 中设置的 Mini App，否则为命令列表）。
gateways.pachca:
  en: 'Pachca integration bot adapter: reads the bot''s events history and answers through the Pachca REST API. Turn on Save events history (events_history_enabled) in the bot''s outgoing webhook settings. See https://coddy.dev/docs/surfaces/pachca.'
  zh: Pachca 集成机器人适配器：读取机器人的事件历史，并通过 Pachca REST API 响应。请在机器人的出站 webhook 设置中开启 "Save events history"（events_history_enabled）。参见 https://coddy.dev/docs/surfaces/pachca。
gateways.pachca.enable:
  en: Run the Pachca bot in this coddy serve process.
  zh: 在此 coddy serve 进程中运行 Pachca 机器人。
gateways.pachca.token:
  en: Access token of the Pachca integration bot. Leave empty to read the PACHCA_BOT_TOKEN environment variable (e.g. via ~/.coddy/.env).
  zh: Pachca 集成机器人的访问令牌。留空则读取 PACHCA_BOT_TOKEN 环境变量（例如通过 ~/.coddy/.env）。
gateways.pachca.proxy:
  en: 'inherit (the default, the same as leaving the key out), none, or a proxy URL: http://, https://, socks5:// or socks5h://, read like providers[].proxy. inherit follows HTTPS_PROXY, HTTP_PROXY and NO_PROXY of the Coddy process; none connects directly; a proxy URL sends every Pachca API request through that proxy.'
  zh: inherit（默认值，等同于省略该键）、none 或代理 URL：http://, https://, socks5:// 或 socks5h://，读取方式与 providers[].proxy 相同。inherit 会遵循 Coddy 进程的 HTTPS_PROXY、HTTP_PROXY 和 NO_PROXY；none 直接连接；代理 URL 会将每个 Pachca API 请求都通过该代理发送。
gateways.pachca.poll_interval_seconds:
  en: How often the events history is read, in seconds (1 to 60). Pachca answers that method at about five requests per two seconds.
  zh: 读取事件历史的频率，单位为秒（1 到 60）。Pachca 对该方法的响应速率约为每两秒五个请求。
gateways.pachca.admins:
  en: Pachca user IDs with elevated rights; admins always pass access checks.
  zh: 具有提升权限的 Pachca 用户 ID；管理员始终通过访问检查。
gateways.pachca.default_access:
  en: 'Fallback access level for chats without an override: "all", "admins", or "group:<name>".'
  zh: 未设置覆盖的聊天所使用的回退访问级别："all"、"admins" 或 "group:<name>"。
gateways.pachca.default_isolation:
  en: 'Fallback session isolation for group chats: "individual" (session per user), "shared" (one session for all), "admin" (admins only, shared session).'
  zh: 群聊的回退会话隔离方式："individual"（每个用户一个会话）、"shared"（所有用户共用一个会话）、"admin"（仅管理员，共用会话）。
gateways.pachca.user_groups:
  en: Named sets of user IDs referenced from access fields as group:<name>.
  zh: 具名用户 ID 集合，可在访问字段中以 group:<name> 引用。
gateways.pachca.user_groups[].name:
  en: Group name referenced as group:<name>.
  zh: 以 group:<name> 引用的组名。
gateways.pachca.user_groups[].user_ids:
  en: Pachca user IDs in this group.
  zh: 此组中的 Pachca 用户 ID。
gateways.pachca.chats:
  en: Per-chat overrides keyed by the Pachca chat id (a thread has a chat id of its own).
  zh: 按 Pachca 聊天 ID 设置的按聊天覆盖项（每个话题都有自己的聊天 ID）。
gateways.pachca.chats[].chat_id:
  en: Pachca chat id.
  zh: Pachca 聊天 ID。
gateways.pachca.chats[].isolation:
  en: Per-chat session isolation override.
  zh: 按聊天设置的会话隔离覆盖项。
gateways.pachca.chats[].access:
  en: 'Per-chat access override: "all", "admins", or "group:<name>".'
  zh: 按聊天设置的访问覆盖项："all"、"admins" 或 "group:<name>"。
supervisor:
  en: Checks a session goal (/goal) after every turn with a second model, continues unfinished work within bounds, and watches for stalled or looping turns; see https://coddy.dev/docs/features/session-supervisor.
  zh: 使用第二个模型在每轮后检查会话目标（/goal），在限定范围内继续未完成的工作，并监视停滞或循环的轮次；参见 https://coddy.dev/docs/features/session-supervisor。
supervisor.enable:
  en: Check ordinary turns against the latest request even without a /goal. A session goal is checked whatever this switch says.
  zh: 即使没有 /goal，也会根据最新请求检查普通轮次。无论此开关如何设置，会话目标都会被检查。
supervisor.model:
  en: Configured models[].model that checks the work. Empty uses the session's own model, which then grades its own work; a model of another family is the better judge.
  zh: 用于检查工作的已配置 models[].model。留空则使用会话自身的模型，此时它会评判自己的工作；另一家族的模型是更好的评判者。
supervisor.verify:
  en: 'Confirm a met verdict before the goal is closed: the goal-verifier subagent reads the workspace with read-only tools and checks every requirement. Unset means true.'
  zh: 在目标关闭前确认已满足的判定：goal-verifier 子智能体使用只读工具读取工作区，并检查每一项要求。未设置表示 true。
supervisor.stall_seconds:
  en: Seconds a goal turn may go without any update before the watchdog cuts it and starts a recovery turn. Permission prompts, running tools and running background tasks pause the timer. 0 disables it.
  zh: 目标轮次可以没有任何更新地持续多少秒，之后看门狗会切断它并启动恢复轮次。权限提示、正在运行的工具和正在运行的后台任务会暂停计时器。0 表示禁用。
supervisor.max_nudges:
  en: Recovery turns after a stall, a tool loop or a failed turn, per run of the supervisor.
  zh: 每次监督器运行中，在停滞、工具循环或轮次失败后可用的恢复轮次数。
supervisor.max_continuations:
  en: Automatic continuation turns one goal may use; when they run out the goal gets one wrap-up turn and stops as limited.
  zh: 一个目标可以使用的自动继续轮次数；用完后，该目标会获得一个收尾轮次，并以受限状态停止。
supervisor.loop_repeat:
  en: How many times a repeating cycle of identical tool operations (same call, same result) may come round before the watchdog cuts the turn. 0 disables loop detection.
  zh: 相同工具操作（相同调用、相同结果）的重复循环可以出现多少轮，之后看门狗会切断该轮次。0 表示禁用循环检测。
supervisor.token_budget:
  en: Uncached input plus output tokens one goal's turns may spend; 0 means no cap.
  zh: 一个目标的各轮次可以消耗的未缓存输入 token 与输出 token 的总数；0 表示不设上限。
supervisor.max_chain_sessions:
  en: Sessions one goal chain (/goal --then-file) may open one after another; when the goal of the last one is met, the chain stops. 0 turns goal chains off.
  zh: 一个目标链（/goal --then-file）可以依次打开的会话数；当最后一个会话的目标得到满足时，该链停止。0 会关闭目标链。
providers[].user_agent:
  en: Client identity for types openai and anthropic. Empty (the default), openai or anthropic keeps the current provider SDK identity (OpenAI/Go or Anthropic/Go); coddy sends Coddy/<running version>. Applies to completions and model listing. Ignored for other provider types.
  zh: 用于 openai 和 anthropic 类型的客户端身份。留空（默认值）、openai 或 anthropic 会保留当前提供商 SDK 身份（OpenAI/Go 或 Anthropic/Go）；coddy 会发送 Coddy/<running version>。适用于补全和模型列表。其他提供商类型会忽略此项。
